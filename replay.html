<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Replay · Bertha</title>
<!-- site-meta -->
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="theme-color" content="#7cff6b">
<meta name="description" content="A Bertha match, round by round.">
<meta property="og:site_name" content="Bertha">
<meta property="og:type" content="website">
<meta property="og:title" content="Replay · Bertha">
<meta property="og:description" content="A Bertha match, round by round.">
<meta property="og:url" content="https://berthabot.me/replay.html">
<meta property="og:image" content="https://berthabot.me/assets/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<!-- site-meta -->
<link rel="stylesheet" href="assets/arcade.css?v=20261001b">
<script src="assets/bertha.js?v=20261001b"></script>
</head>
<body>
<div class="wrap">
  <main id="app"><div class="loading">LOADING REPLAY…</div></main>
</div>

<script>
(async () => {
  const { el } = B;
  B.topbar("replays.html");
  const app = B.$("#app");
  const gameId = B.param("game"), duelId = B.param("duel");
  if (!gameId && !duelId) { B.fail(app, new Error("no match in the link")); return; }

  let data, levels = {};
  try {
    await B.loadPlayers();
    data = await B.json(gameId ? `matches/detail/${encodeURIComponent(gameId)}.json` : `matches/detail/duel-${encodeURIComponent(duelId)}.json`);
    const lb = await B.json("stats/leaderboard.json").catch(() => ({ players: [] }));
    levels = Object.fromEntries(lb.players.map(p => [p.user_id, p.level.level]));
  } catch (e) { B.fail(app, e); return; }
  const xp = data.xp || {}, layers = data.xp_layers || {}, pass = data.pass_xp || {};
  const hasXp = Object.keys(xp).length > 0, hasPass = Object.keys(pass).length > 0;

  // Level XP, with the bonuses on top of base underneath (Daily 2x, Double XP, hardcore, replay, XP Boost).
  function xpCell(id) {
    const lay = layers[id] || {};
    const order = Object.keys(B.XP_LAYERS_SHORT);
    const extras = Object.entries(lay).filter(([k, v]) => k !== "base" && v)
      .sort((x, y) => (order.indexOf(x[0]) + 1 || 99) - (order.indexOf(y[0]) + 1 || 99));
    return el("td", { class: "num", style: { color: "var(--neon)" } }, xp[id] ? `+${B.fmt(xp[id])}` : "—",
      extras.length ? el("div", { class: "xpsub" }, `${B.fmt(lay.base || 0)} base`,
        extras.map(([k, v]) => ` + ${B.fmt(v)} ${B.XP_LAYERS_SHORT[k] || k}`)) : null);
  }
  // Season pass XP: the capped game/duel grant, plus any flaming pumpkin smashed in this game.
  function passNotes(p) {
    const notes = [];
    if (p.pumpkin) notes.push(`incl. ${B.fmt(p.pumpkin)} from a flaming pumpkin`);
    return notes;
  }
  function passCell(id) {
    const p = pass[id];
    if (!p) return el("td", { class: "num dim" }, "—");
    const notes = passNotes(p);
    return el("td", { class: "num", style: { color: "var(--yellow)" } }, `+${B.fmt(p.total)} ${p.emoji}`,
      notes.length ? el("div", { class: "xpsub" }, notes.join(" · ")) : null);
  }

  // One round. Answers are never published, so the card shows the question and what happened.
  function roundCard(n, r, result) {
    const insane = r.mode === "insane";
    return el("div", { class: `round${insane ? " insane" : ""}` },
      el("div", { class: "no" }, insane ? "!!" : String(n).padStart(2, "0")),
      el("div", {},
        el("div", { class: "cat" }, `${(r.category || "").toUpperCase()}${insane ? ` · INSANE ROUND · ${B.fmt(r.answer_count)} ANSWERS` : ""}`),
        el("div", { class: "q" }, r.question_text || "(question deleted)"),
        r.image_url ? el("img", { class: "qimg", src: r.image_url, alt: "Question image", loading: "lazy" }) : null,
        el("div", { class: "result" }, result)));
  }

  // The first 10 rounds, then a SHOW ALL button (a 50-round game is a very long page on a phone).
  function roundList(cards) {
    const box = el("div", { class: "mlist" });
    return [box, B.showMore(box, cards, 10, "ROUNDS")];
  }

  function drawGame() {
    const g = data.game, rounds = data.rounds || [];
    const k = B.matchKind(g);
    document.title = `${k.label} · ${B.day(g.ended_at)} · Bertha`;

    // final standings from points actually awarded
    const tally = {};
    for (const r of rounds) for (const a of r.answers || []) {
      const t = (tally[a.user_id] = tally[a.user_id] || { pts: 0, correct: 0 });
      t.pts += a.points_awarded || 0; t.correct++;
    }
    for (const id of [...Object.keys(xp), ...Object.keys(pass)]) tally[id] = tally[id] || { pts: 0, correct: 0 };
    const standings = Object.entries(tally).sort((a, b) => b[1].pts - a[1].pts || (xp[b[0]] || 0) - (xp[a[0]] || 0));
    const REASONS = { completed: "Played to the end", stopped: "Stopped early", inactivity_timeout: "Ended: nobody was typing",
      consecutive_skips: "Ended: too many unanswered rounds", error: "Ended by an error", abandoned: "Abandoned" };

    const table = standings.length ? el("div", { class: "table-scroll" }, el("table", { class: "scores" },
      el("thead", {}, el("tr", {}, el("th", {}, "RANK"), el("th", { class: "num" }, "PTS"), el("th", {}, "NAME"),
        el("th", { class: "num" }, "CORRECT"), hasXp ? el("th", { class: "num" }, "XP EARNED") : null,
        hasPass ? el("th", { class: "num" }, "PASS XP") : null)),
      el("tbody", {}, standings.map(([id, t], i) => el("tr", { class: "row", style: { color: B.rankColor(i) }, onclick: () => (location.href = B.playerHref(id)) },
        el("td", { class: "rank" }, B.ordinal(i + 1)), el("td", { class: "big num" }, String(t.pts)),
        el("td", {}, el("div", { class: "who" }, B.avatar(id), B.playerLink(id))), el("td", { class: "num dim" }, String(t.correct)),
        hasXp ? xpCell(id) : null, hasPass ? passCell(id) : null))))) : el("p", {}, "Nobody scored.");

    const cards = rounds.map((r, i) => {
      const ans = r.answers || [];
      let result;
      if (r.mode === "insane") {
        const by = {};
        for (const a of ans) by[a.user_id] = (by[a.user_id] || 0) + 1;
        result = ans.length
          ? el("div", { class: "found" }, el("span", { style: { color: "var(--pink)" } }, `${ans.length} FOUND:`),
              Object.entries(by).sort((a, b) => b[1] - a[1]).map(([id, n]) => el("span", {}, B.playerLink(id), ` ×${n}`)))
          : el("span", { style: { color: "var(--muted)" } }, "NOBODY FOUND ANY");
      } else if (ans.length) {
        const a = ans[0];
        result = el("span", {}, el("span", { style: { color: "var(--neon)" } }, "✓ "), B.playerLink(a.user_id),
          ` in ${B.secs(a.response_time_ms)} · +${a.points_awarded} pts`, a.exact_match === false ? " · close spelling" : "");
      } else {
        result = el("span", { style: { color: "var(--muted)" } }, "✗ NOBODY GOT IT");
      }
      return roundCard(i + 1, r, result);
    });

    app.replaceChildren(...[
      el("div", { class: "btn-row-label", style: { color: k.color, marginTop: "40px" } }, k.label),
      el("h1", { class: "page-title", style: { color: "var(--text)", marginTop: "8px" } }, B.matchTitle(g)),
      el("p", { class: "page-sub" },
        `${B.when(g.started_at)} ET · ${B.dur((B.ts(g.ended_at) || 0) - (B.ts(g.started_at) || 0))} · ${g.rounds_played} of ${g.total_rounds} rounds · `,
        REASONS[g.end_reason] || g.end_reason,
        g.started_by ? el("span", {}, " · started by ", B.playerLink(g.started_by)) : null),
      el("h2", { class: "section" }, "FINAL SCORES"), table,
      hasXp || !beforeXpLog(g.started_at) ? null : el("p", { class: "page-sub" }, "XP per match is recorded for games played from Sep 28, 2026."),
      el("h2", { class: "section" }, `ROUND BY ROUND · ${rounds.length}`),
      ...roundList(cards),
    ].filter(Boolean));
  }

  // Per-match XP is only logged from Sep 28, 2026 (midnight ET) -- a newer match with no XP just had nobody earn any.
  const beforeXpLog = t => (B.ts(t) || 0) < Date.parse("2026-09-28T04:00:00Z");

  function drawDuel() {
    const m = data.match;
    document.title = `Duel · ${B.day(m.ended_at)} · Bertha`;
    const score = { [m.challenger_id]: 0, [m.opponent_id]: 0 };
    const cards = (data.rounds || []).map(r => {
      const w = r.winner_id != null ? String(r.winner_id) : null;
      // The insane-round tiebreaker decides the duel but isn't part of the score (the title and card say 1–1).
      const tiebreak = r.mode === "insane";
      if (w && !tiebreak) score[w] = (score[w] || 0) + 1;
      const running = `${score[m.challenger_id]}–${score[m.opponent_id]}`;
      const result = w
        ? el("span", {}, el("span", { style: { color: "var(--neon)" } }, "✓ "), B.playerLink(w),
            ` in ${B.secs(r.response_time_ms)} · ${tiebreak ? "wins the tiebreaker" : `score ${running}`}`)
        : el("span", { style: { color: "var(--muted)" } }, `✗ NOBODY GOT IT · ${tiebreak ? "tiebreaker" : `score ${running}`}`);
      return roundCard(r.round_number, r, result);
    });
    const xpLine = hasXp
      ? el("div", { class: "xpline" }, el("span", { class: "label" }, "XP EARNED"),
          [m.challenger_id, m.opponent_id].map(id => el("span", {}, B.playerLink(id), el("b", {}, xp[id] ? ` +${B.fmt(xp[id])}` : " +0"),
            pass[id] ? el("span", { style: { color: "var(--yellow)" } }, ` · +${B.fmt(pass[id].total)} ${pass[id].emoji}`,
              passNotes(pass[id]).length ? el("span", { class: "xpsub" }, ` (${passNotes(pass[id]).join(", ")})`) : null) : null)))
      : beforeXpLog(m.ended_at) ? el("p", { class: "page-sub" }, "XP per match is recorded for duels played from Sep 28, 2026.") : null;
    app.replaceChildren(...[
      el("div", { class: "btn-row-label", style: { color: B.MODE_COLORS.duel, marginTop: "40px" } }, `DUEL · ${(m.format_label || "").toUpperCase()}`),
      el("h1", { class: "page-title", style: { color: "var(--text)", marginTop: "8px" } }, B.matchTitle(m)),
      el("p", { class: "page-sub" }, `${B.when(m.ended_at)} ET${m.decided_by_tiebreaker ? " · decided by an insane-round tiebreaker" : ""}`),
      B.fightCard(m, levels),
      xpLine,
      el("h2", { class: "section" }, `ROUND BY ROUND · ${cards.length}`),
      ...roundList(cards),
      cards.length ? null : el("p", { class: "page-sub" }, "No round detail was recorded for this duel."),
    ].filter(Boolean));
  }

  (gameId ? drawGame : drawDuel)();
  B.footer();
})();
</script>
</body>
</html>
