<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Replay · Bertha</title>
<!-- site-meta -->
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="theme-color" content="#7cff6b">
<meta name="description" content="A Bertha match, round by round.">
<meta property="og:site_name" content="Bertha">
<meta property="og:type" content="website">
<meta property="og:title" content="Replay · Bertha">
<meta property="og:description" content="A Bertha match, round by round.">
<meta property="og:url" content="https://berthabot.me/replay.html">
<meta property="og:image" content="https://berthabot.me/assets/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<!-- site-meta -->
<link rel="stylesheet" href="assets/arcade.css?v=20261001c">
<script src="assets/bertha.js?v=20261001c"></script>
<style>
  /* momentum strip: one block per round, in the colour of whoever won it */
  .strip-read { min-height: 2.4em; font-size: 22px; line-height: 1.2; margin-bottom: 10px; }
  .strip-read .k { font: 10px/1.6 var(--pixel); color: var(--yellow); margin-right: 10px; }
  .strip { display: flex; flex-wrap: wrap; gap: 4px; }
  .strip button { flex: 0 0 auto; width: 26px; height: 30px; padding: 0; border: 0; cursor: pointer; background: var(--c);
    box-shadow: 3px 3px 0 rgba(0,0,0,.45); font: 8px/30px var(--pixel); color: var(--bg); text-align: center; }
  .strip button.none { background: transparent; border: 2px dashed var(--line-dim); box-shadow: none; }
  .strip button.ins { outline: 3px solid var(--pink); outline-offset: -3px; }
  .strip button.on { transform: translateY(-4px); box-shadow: 0 0 0 2px var(--text), 3px 7px 0 rgba(0,0,0,.45); }
  @media (max-width: 620px) { .strip button { width: 22px; height: 26px; line-height: 26px; } }
  .legend { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 12px; font-size: 20px; }
  .legend .sw { display: inline-block; width: 12px; height: 12px; margin-right: 8px; vertical-align: 0; }

  /* score race */
  .race svg { display: block; width: 100%; height: 200px; }
  .race .ax { display: flex; justify-content: space-between; font: 8px/1.6 var(--pixel); color: var(--muted); margin-top: 6px; }

  /* who answered: avatar, time, and the points tier it landed in */
  .who-ans { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
  .tier { font: 9px/1 var(--pixel); padding: 5px 7px; border: 2px solid currentColor; }
  /* insane round: every find on a track from the start of the round to the end */
  .track { position: relative; height: 34px; margin: 10px 0 6px; border: 3px solid var(--line-dim); background:
    repeating-linear-gradient(90deg, transparent 0 calc(10% - 2px), var(--line-dim) calc(10% - 2px) 10%), var(--bg); }
  .track i { position: absolute; top: 4px; bottom: 4px; width: 6px; margin-left: -3px; background: var(--c); box-shadow: 0 0 6px var(--c); }
  .track-ax { display: flex; justify-content: space-between; font: 8px/1.6 var(--pixel); color: var(--muted); }
  .found .sw { display: inline-block; width: 10px; height: 10px; margin-right: 6px; }
</style>
</head>
<body>
<div class="wrap">
  <main id="app"><div class="loading">LOADING REPLAY…</div></main>
</div>

<script>
(async () => {
  const { el } = B;
  B.topbar("replays.html");
  const app = B.$("#app");
  const gameId = B.param("game"), duelId = B.param("duel");
  if (!gameId && !duelId) { B.fail(app, new Error("no match in the link")); return; }

  let data, levels = {};
  try {
    await B.loadPlayers();
    data = await B.json(gameId ? `matches/detail/${encodeURIComponent(gameId)}.json` : `matches/detail/duel-${encodeURIComponent(duelId)}.json`);
    const lb = await B.json("stats/leaderboard.json").catch(() => ({ players: [] }));
    levels = Object.fromEntries(lb.players.map(p => [p.user_id, p.level.level]));
  } catch (e) { B.fail(app, e); return; }
  const xp = data.xp || {}, layers = data.xp_layers || {}, pass = data.pass_xp || {};
  const hasXp = Object.keys(xp).length > 0, hasPass = Object.keys(pass).length > 0;

  // Level XP, with the bonuses on top of base underneath (Daily 2x, Double XP, hardcore, replay, XP Boost).
  function xpCell(id) {
    const lay = layers[id] || {};
    const order = Object.keys(B.XP_LAYERS_SHORT);
    const extras = Object.entries(lay).filter(([k, v]) => k !== "base" && v)
      .sort((x, y) => (order.indexOf(x[0]) + 1 || 99) - (order.indexOf(y[0]) + 1 || 99));
    return el("td", { class: "num", style: { color: "var(--neon)" } }, xp[id] ? `+${B.fmt(xp[id])}` : "—",
      extras.length ? el("div", { class: "xpsub" }, `${B.fmt(lay.base || 0)} base`,
        extras.map(([k, v]) => ` + ${B.fmt(v)} ${B.XP_LAYERS_SHORT[k] || k}`)) : null);
  }
  // Season pass XP: the capped game/duel grant, plus any flaming pumpkin smashed in this game.
  function passNotes(p) {
    const notes = [];
    if (p.pumpkin) notes.push(`incl. ${B.fmt(p.pumpkin)} from a flaming pumpkin`);
    return notes;
  }
  function passCell(id) {
    const p = pass[id];
    if (!p) return el("td", { class: "num dim" }, "—");
    const notes = passNotes(p);
    return el("td", { class: "num", style: { color: "var(--yellow)" } }, `+${B.fmt(p.total)} ${p.emoji}`,
      notes.length ? el("div", { class: "xpsub" }, notes.join(" · ")) : null);
  }

  // Which hint window a standard answer landed in (the bot's answer_log.hint_window, recorded from Sep 28): 0 before
  // any hint, 1 after hint 1, 2 after hint 2. Points can't tell you this -- a Seasonal Spotlight multiplies them --
  // so older answers (and hardcore, which has no hints) just show their points.
  const WINDOWS = [["BEFORE HINTS", "var(--neon)"], ["AFTER HINT 1", "var(--yellow)"], ["AFTER HINT 2", "var(--pink)"]];
  function answeredBy(id, ms, pts, extra, hintWindow) {
    const w = WINDOWS[hintWindow];
    return el("span", { class: "who-ans" }, el("span", { style: { color: "var(--neon)" } }, "✓"), B.avatar(id, "sm"), B.playerLink(id),
      el("span", {}, B.secs(ms)),
      pts ? el("span", { class: "tier", style: { color: w ? w[1] : "var(--cyan)" } }, w ? `+${pts} · ${w[0]}` : `+${pts} PTS`) : null,
      extra || null);
  }
  // Insane round: each find as a mark on a track from the round's start to its end, in its finder's colour.
  function insaneTrack(r, colorOf) {
    const ans = r.answers || [];
    const len = Math.max(1, (B.ts(r.ended_at) || 0) - (B.ts(r.started_at) || 0), ...ans.map(a => a.response_time_ms || 0));
    return [el("div", { class: "track", role: "img", "aria-label": `${ans.length} answers found over ${B.dur(len)}` },
      ans.map(a => el("i", { style: { left: `${(100 * (a.response_time_ms || 0)) / len}%`, "--c": colorOf(a.user_id) },
        title: `${B.name(a.user_id)} · ${B.secs(a.response_time_ms)}` }))),
      el("div", { class: "track-ax" }, el("span", {}, "START"), el("span", {}, B.dur(len)))];
  }
  // A row of blocks, one per round, coloured by who won it; tapping one shows what happened in the readout above.
  function momentumStrip(blocks, legend) {
    const read = el("div", { class: "strip-read", "aria-live": "polite" });
    let on = null;
    const strip = el("div", { class: "strip" }, blocks.map((b, i) => {
      const btn = el("button", { type: "button", class: `${b.color ? "" : "none"}${b.insane ? " ins" : ""}`.trim(),
        style: { "--c": b.color || "transparent" }, "aria-label": `Round ${b.no}` }, b.insane ? "!" : "");
      const pick = () => { if (on) on.classList.remove("on"); on = btn; btn.classList.add("on"); read.replaceChildren(el("span", { class: "k" }, `ROUND ${b.no}`), ...b.text); };
      btn.addEventListener("click", pick);
      btn.addEventListener("mouseenter", pick);
      if (i === 0) setTimeout(pick);
      return btn;
    }));
    return el("div", { class: "chart" }, read, strip,
      el("div", { class: "legend" }, legend.map(([id, c]) => el("span", {}, el("i", { class: "sw", style: { background: c } }), B.name(id))),
        el("span", { class: "dim" }, el("i", { class: "sw", style: { border: "2px dashed var(--line-dim)" } }), "nobody"),
        blocks.some(b => b.insane) ? el("span", { class: "dim" }, el("i", { class: "sw", style: { outline: "3px solid var(--pink)", outlineOffset: "-3px" } }), "insane round") : null));
  }
  // Running score per player across the rounds, as pixel step lines (top 5 of the final standings).
  function scoreRace(rounds, ids, colorOf) {
    const n = rounds.length, run = Object.fromEntries(ids.map(id => [id, [0]]));
    rounds.forEach(r => {
      const got = {};
      for (const a of r.answers || []) got[a.user_id] = (got[a.user_id] || 0) + (a.points_awarded || 0);
      for (const id of ids) run[id].push(run[id][run[id].length - 1] + (got[id] || 0));
    });
    const max = Math.max(1, ...ids.map(id => run[id][n]));
    const W = 1000, H = 200, pad = 8;
    const x = i => (W * i) / n, y = v => H - pad - ((H - 2 * pad) * v) / max;
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
    svg.setAttribute("preserveAspectRatio", "none");
    svg.setAttribute("role", "img");
    svg.setAttribute("aria-label", "Running score after each round");
    for (let g = 1; g < 4; g++) {
      const ln = document.createElementNS(svg.namespaceURI, "line");
      Object.entries({ x1: 0, x2: W, y1: y((max * g) / 4), y2: y((max * g) / 4), stroke: "#2a2440", "stroke-width": 2, "vector-effect": "non-scaling-stroke" })
        .forEach(([k, v]) => ln.setAttribute(k, v));
      svg.append(ln);
    }
    [...ids].reverse().forEach(id => {  // leader drawn last, on top
      const pts = run[id].flatMap((v, i) => (i ? [`${x(i)},${y(run[id][i - 1])}`, `${x(i)},${y(v)}`] : [`${x(0)},${y(0)}`]));
      const pl = document.createElementNS(svg.namespaceURI, "polyline");
      Object.entries({ points: pts.join(" "), fill: "none", stroke: colorOf(id), "stroke-width": 4, "stroke-linejoin": "miter",
        "shape-rendering": "crispEdges", "vector-effect": "non-scaling-stroke" }).forEach(([k, v]) => pl.setAttribute(k, v));
      svg.append(pl);
    });
    return el("div", { class: "chart race" }, svg,
      el("div", { class: "ax" }, el("span", {}, "ROUND 1"), el("span", {}, `ROUND ${n}`)),
      el("div", { class: "legend" }, ids.map(id => el("span", {}, el("i", { class: "sw", style: { background: colorOf(id) } }),
        B.name(id), el("span", { class: "dim" }, ` ${B.fmt(run[id][n])} pts`)))));
  }

  // One round. Answers are never published, so the card shows the question and what happened.
  function roundCard(n, r, result) {
    const insane = r.mode === "insane";
    return el("div", { class: `round${insane ? " insane" : ""}` },
      el("div", { class: "no" }, insane ? "!!" : String(n).padStart(2, "0")),
      el("div", {},
        el("div", { class: "cat" }, `${(r.category || "").toUpperCase()}${insane ? ` · INSANE ROUND · ${B.fmt(r.answer_count)} ANSWERS` : ""}`),
        el("div", { class: "q" }, r.question_text || "(question deleted)"),
        r.image_url ? el("img", { class: "qimg", src: r.image_url, alt: "Question image", loading: "lazy" }) : null,
        el("div", { class: "result" }, result)));
  }

  // The first 10 rounds, then a SHOW ALL button (a 50-round game is a very long page on a phone).
  function roundList(cards) {
    const box = el("div", { class: "mlist" });
    return [box, B.showMore(box, cards, 10, "ROUNDS")];
  }

  function drawGame() {
    const g = data.game, rounds = data.rounds || [];
    const k = B.matchKind(g);
    document.title = `${k.label} · ${B.day(g.ended_at)} · Bertha`;

    // final standings from points actually awarded
    const tally = {};
    for (const r of rounds) for (const a of r.answers || []) {
      const t = (tally[a.user_id] = tally[a.user_id] || { pts: 0, correct: 0 });
      t.pts += a.points_awarded || 0; t.correct++;
    }
    for (const id of [...Object.keys(xp), ...Object.keys(pass)]) tally[id] = tally[id] || { pts: 0, correct: 0 };
    const standings = Object.entries(tally).sort((a, b) => b[1].pts - a[1].pts || (xp[b[0]] || 0) - (xp[a[0]] || 0));
    const REASONS = { completed: "Played to the end", stopped: "Stopped early", inactivity_timeout: "Ended: nobody was typing",
      consecutive_skips: "Ended: too many unanswered rounds", error: "Ended by an error", abandoned: "Abandoned" };

    const table = standings.length ? el("div", { class: "table-scroll" }, el("table", { class: "scores" },
      el("thead", {}, el("tr", {}, el("th", {}, "RANK"), el("th", { class: "num" }, "PTS"), el("th", {}, "NAME"),
        el("th", { class: "num" }, "CORRECT"), hasXp ? el("th", { class: "num" }, "XP EARNED") : null,
        hasPass ? el("th", { class: "num" }, "PASS XP") : null)),
      el("tbody", {}, standings.map(([id, t], i) => el("tr", { class: "row", style: { color: B.rankColor(i) }, onclick: () => (location.href = B.playerHref(id)) },
        el("td", { class: "rank" }, B.ordinal(i + 1)), el("td", { class: "big num" }, String(t.pts)),
        el("td", {}, el("div", { class: "who" }, B.avatar(id), B.playerLink(id))), el("td", { class: "num dim" }, String(t.correct)),
        hasXp ? xpCell(id) : null, hasPass ? passCell(id) : null))))) : el("p", {}, "Nobody scored.");

    // Each player keeps one colour for the whole replay: their row colour in FINAL SCORES (the top 5), grey after that.
    const colorOf = id => { const i = standings.findIndex(([sid]) => sid === String(id)); return i >= 0 && i < 5 ? B.rankColor(i) : "#8b86a8"; };
    const cards = rounds.map((r, i) => {
      const ans = r.answers || [];
      let result;
      if (r.mode === "insane") {
        const by = {};
        for (const a of ans) by[a.user_id] = (by[a.user_id] || 0) + 1;
        result = ans.length
          ? el("div", {}, ...insaneTrack(r, colorOf), el("div", { class: "found" }, el("span", { style: { color: "var(--pink)" } }, `${ans.length} FOUND:`),
              Object.entries(by).sort((a, b) => b[1] - a[1]).map(([id, n]) => el("span", {}, el("i", { class: "sw", style: { background: colorOf(id) } }), B.playerLink(id), ` ×${n}`))))
          : el("span", { style: { color: "var(--muted)" } }, "NOBODY FOUND ANY");
      } else if (ans.length) {
        const a = ans[0];
        result = answeredBy(a.user_id, a.response_time_ms, a.points_awarded, a.exact_match === false ? el("span", { class: "dim" }, "close spelling") : null, a.hint_window);
      } else {
        result = el("span", { style: { color: "var(--muted)" } }, "✗ NOBODY GOT IT");
      }
      return roundCard(i + 1, r, result);
    });

    function momentumSection() {
      if (rounds.length < 2) return [];
      const blocks = rounds.map((r, i) => {
        const ans = r.answers || [];
        if (r.mode === "insane") {
          const by = {};
          for (const a of ans) by[a.user_id] = (by[a.user_id] || 0) + 1;
          const top = Object.entries(by).sort((a, b) => b[1] - a[1])[0];
          return { no: i + 1, insane: true, color: top ? colorOf(top[0]) : null,
            text: [`insane round · ${ans.length} found`, top ? el("span", { class: "dim" }, ` · most by ${B.name(top[0])} (${top[1]})`) : ""] };
        }
        const a = ans[0];
        return a ? { no: i + 1, color: colorOf(a.user_id), text: [B.name(a.user_id), el("span", { class: "dim" }, ` · ${B.secs(a.response_time_ms)} · +${a.points_awarded}`)] }
          : { no: i + 1, color: null, text: [el("span", { class: "dim" }, "nobody got it")] };
      });
      const ids = standings.slice(0, 5).filter(([, t]) => t.pts > 0).map(([id]) => id);
      return [el("h2", { class: "section" }, "MOMENTUM"), momentumStrip(blocks, ids.map(id => [id, colorOf(id)])),
        ids.length ? el("h2", { class: "section" }, "SCORE RACE") : null, ids.length ? scoreRace(rounds, ids, colorOf) : null];
    }

    app.replaceChildren(...[
      el("div", { class: "btn-row-label", style: { color: k.color, marginTop: "40px" } }, k.label),
      el("h1", { class: "page-title", style: { color: "var(--text)", marginTop: "8px" } }, B.matchTitle(g)),
      el("p", { class: "page-sub" },
        `${B.when(g.started_at)} ET · ${B.dur((B.ts(g.ended_at) || 0) - (B.ts(g.started_at) || 0))} · ${g.rounds_played} of ${g.total_rounds} rounds · `,
        REASONS[g.end_reason] || g.end_reason,
        g.started_by ? el("span", {}, " · started by ", B.playerLink(g.started_by)) : null),
      el("h2", { class: "section" }, "FINAL SCORES"), table,
      hasXp || !beforeXpLog(g.started_at) ? null : el("p", { class: "page-sub" }, "XP per match is recorded for games played from Sep 28, 2026."),
      ...momentumSection(),
      el("h2", { class: "section" }, `ROUND BY ROUND · ${rounds.length}`),
      ...roundList(cards),
    ].filter(Boolean));
  }

  // Per-match XP is only logged from Sep 28, 2026 (midnight ET) -- a newer match with no XP just had nobody earn any.
  const beforeXpLog = t => (B.ts(t) || 0) < Date.parse("2026-09-28T04:00:00Z");

  function drawDuel() {
    const m = data.match;
    document.title = `Duel · ${B.day(m.ended_at)} · Bertha`;
    const score = { [m.challenger_id]: 0, [m.opponent_id]: 0 };
    const cards = (data.rounds || []).map(r => {
      const w = r.winner_id != null ? String(r.winner_id) : null;
      // The insane-round tiebreaker decides the duel but isn't part of the score (the title and card say 1–1).
      const tiebreak = r.mode === "insane";
      if (w && !tiebreak) score[w] = (score[w] || 0) + 1;
      const running = `${score[m.challenger_id]}–${score[m.opponent_id]}`;
      const result = w
        ? answeredBy(w, r.response_time_ms, 0, el("span", { class: "dim" }, tiebreak ? "wins the tiebreaker" : `score ${running}`))
        : el("span", { style: { color: "var(--muted)" } }, `✗ NOBODY GOT IT · ${tiebreak ? "tiebreaker" : `score ${running}`}`);
      return roundCard(r.round_number, r, result);
    });
    const xpLine = hasXp
      ? el("div", { class: "xpline" }, el("span", { class: "label" }, "XP EARNED"),
          [m.challenger_id, m.opponent_id].map(id => el("span", {}, B.playerLink(id), el("b", {}, xp[id] ? ` +${B.fmt(xp[id])}` : " +0"),
            pass[id] ? el("span", { style: { color: "var(--yellow)" } }, ` · +${B.fmt(pass[id].total)} ${pass[id].emoji}`,
              passNotes(pass[id]).length ? el("span", { class: "xpsub" }, ` (${passNotes(pass[id]).join(", ")})`) : null) : null)))
      : beforeXpLog(m.ended_at) ? el("p", { class: "page-sub" }, "XP per match is recorded for duels played from Sep 28, 2026.") : null;
    // The fight card's colours: challenger cyan, opponent pink.
    function duelMomentum() {
      const rs = data.rounds || [];
      if (rs.length < 2) return [];
      const side = { [String(m.challenger_id)]: "var(--cyan)", [String(m.opponent_id)]: "var(--pink)" };
      const blocks = rs.map(r => {
        const w = r.winner_id != null ? String(r.winner_id) : null;
        return { no: r.round_number, insane: r.mode === "insane", color: w ? side[w] : null,
          text: w ? [B.name(w), el("span", { class: "dim" }, ` · ${B.secs(r.response_time_ms)}${r.mode === "insane" ? " · tiebreaker" : ""}`)]
            : [el("span", { class: "dim" }, "nobody got it")] };
      });
      return [el("h2", { class: "section" }, "MOMENTUM"),
        momentumStrip(blocks, [[m.challenger_id, "var(--cyan)"], [m.opponent_id, "var(--pink)"]])];
    }
    app.replaceChildren(...[
      el("div", { class: "btn-row-label", style: { color: B.MODE_COLORS.duel, marginTop: "40px" } }, `DUEL · ${(m.format_label || "").toUpperCase()}`),
      el("h1", { class: "page-title", style: { color: "var(--text)", marginTop: "8px" } }, B.matchTitle(m)),
      el("p", { class: "page-sub" }, `${B.when(m.ended_at)} ET${m.decided_by_tiebreaker ? " · decided by an insane-round tiebreaker" : ""}`),
      B.fightCard(m, levels),
      xpLine,
      ...duelMomentum(),
      el("h2", { class: "section" }, `ROUND BY ROUND · ${cards.length}`),
      ...roundList(cards),
      cards.length ? null : el("p", { class: "page-sub" }, "No round detail was recorded for this duel."),
    ].filter(Boolean));
  }

  (gameId ? drawGame : drawDuel)();
  B.footer();
})();
</script>
</body>
</html>
