<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bertha · The Trivia Machine</title>
<!-- site-meta -->
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="theme-color" content="#7cff6b">
<meta name="description" content="High scores, every-stat leaderboards, player stats, seasons and match replays for Bertha, the Discord trivia bot.">
<meta property="og:site_name" content="Bertha">
<meta property="og:type" content="website">
<meta property="og:title" content="Bertha · The Trivia Machine">
<meta property="og:description" content="High scores, every-stat leaderboards, player stats, seasons and match replays for Bertha, the Discord trivia bot.">
<meta property="og:url" content="https://berthabot.me/">
<meta property="og:image" content="https://berthabot.me/assets/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<!-- site-meta -->
<link rel="stylesheet" href="assets/arcade.css?v=20261001a">
<script src="assets/bertha.js?v=20261001a"></script>
</head>
<body>
<div class="wrap">
  <a class="logo" href="index.html">BERTHA</a>
  <div class="tagline">© 2026 THE TRIVIA MACHINE</div>
  <div class="insert"><span class="blink">INSERT COIN</span> · NEXT DAILY TRIVIA IN <span id="countdown">--:--:--</span></div>

  <main id="app"><div class="loading">LOADING…</div></main>
</div>

<script>
(async () => {
  const { el } = B;
  B.topbar("index.html");
  const app = B.$("#app");

  // live countdown to 2 PM ET
  const cd = B.$("#countdown");
  const tick = () => { cd.textContent = B.clock(B.secondsToDaily()); };
  tick(); setInterval(tick, 1000);

  try {
    await B.loadPlayers();
    const [lb, matches, bugs, missions] = await Promise.all([
      B.json("stats/leaderboard.json"),
      B.allMatches(),
      B.json("bug-reports.json").catch(() => ({ reports: [] })),
      B.json("missions.json").catch(() => ({ week: null })),
    ]);
    const levels = Object.fromEntries(lb.players.map(p => [p.user_id, p.level.level]));
    app.replaceChildren();

    // ---------- HIGH SCORES ----------
    app.append(el("h2", { class: "section", style: { justifyContent: "center", color: "var(--pink)", letterSpacing: "4px" } }, "HIGH SCORES"));
    const board = B.ranking(lb, B.METRIC.total_xp, "alltime").slice(0, 5);
    app.append(el("div", { class: "table-scroll" }, el("table", { class: "scores" },
      el("thead", {}, el("tr", {}, el("th", {}, "RANK"), el("th", { class: "num" }, "XP"), el("th", {}, "NAME"), el("th", { class: "num" }, "LV"))),
      el("tbody", {}, board.map(({ p }, i) => el("tr", { class: "row", style: { color: B.rankColor(i) }, onclick: () => (location.href = B.playerHref(p.user_id)) },
        el("td", { class: "rank" }, B.ordinal(i + 1)),
        el("td", { class: "big num" }, String(p.total_xp)),
        el("td", {}, el("div", { class: "who" }, B.avatar(p.user_id), B.playerLink(p.user_id))),
        el("td", { class: "big num" }, String(p.level.level))))))));
    app.append(el("p", { class: "center" }, el("a", { href: "leaderboard.html", style: { font: "11px var(--pixel)" } }, "EVERY LEADERBOARD ▸")));

    // ---------- LAST FIGHT ----------
    const duels = matches.filter(m => m.kind === "duel");
    const fight = duels.find(m => m.winner_id);
    if (fight) {
      app.append(el("h2", { class: "section" }, "LAST FIGHT", el("a", { href: "replays.html#duels" }, `ALL ${duels.length} DUELS ▸`)));
      app.append(B.fightCard(fight, levels));
      app.append(el("p", { class: "center" }, el("a", { href: B.matchHref(fight), style: { font: "11px var(--pixel)" } }, "WATCH THE REPLAY ▸")));
    }

    // ---------- THIS WEEK'S MISSIONS ----------
    const week = missions && missions.week;
    if (week && week.missions && week.missions.length) {
      const DIFF = { easy: "var(--neon)", medium: "var(--yellow)", hard: "var(--pink)" };
      app.append(el("h2", { class: "section" }, "THIS WEEK'S MISSIONS",
        el("span", { class: "pill", style: { color: "var(--muted)" } }, `RESETS ${B.when(week.week_end).toUpperCase()} ET`)));
      app.append(el("div", { class: "missions" }, week.missions.map(ms => {
        const done = ms.players.filter(x => x.completed_at);
        const lead = ms.players[0];
        return el("div", { class: "mission", style: { "--c": DIFF[ms.difficulty] || "var(--cyan)" } },
          el("span", { class: "diff" }, `${String(ms.difficulty).toUpperCase()} · +${B.fmt(ms.xp_reward)} XP`),
          el("span", { class: "txt" }, ms.text),
          el("span", { class: "who" }, done.length ? `${done.length} completed` : "Nobody's finished it yet",
            lead && !lead.completed_at ? el("span", {}, " · closest: ", B.playerLink(lead.user_id), ` ${B.fmt(lead.progress)}/${B.fmt(ms.target)}`) : null));
      })));
    }

    // ---------- HALL OF FAME ----------
    const top = (key, pd = "alltime") => B.ranking(lb, B.METRIC[key], pd)[0];
    const tiles = [];
    const daily = matches.find(m => m.kind === "game" && m.mode === "daily" && m.winner_id);
    if (daily) tiles.push(["DAILY CHAMP", B.playerLink(daily.winner_id), `${daily.rounds_played} rounds · ${B.day(daily.ended_at)}`, "var(--yellow)"]);
    const streak = top("best_streak");
    if (streak) tiles.push(["LONGEST COMBO", `${streak.v} IN A ROW`, B.name(streak.p.user_id), "var(--cyan)"]);
    const games = matches.filter(m => m.kind === "game").length;
    tiles.push(["MATCHES LOGGED", String(matches.length), `${games} games · ${duels.length} duels`, "var(--pink)", "replays.html"]);
    const pairs = {};
    for (const d of duels) {
      const k = [d.challenger_id, d.opponent_id].sort().join("|");
      (pairs[k] = pairs[k] || { ids: k.split("|"), n: 0, w: {} }).n++;
      if (d.winner_id) pairs[k].w[d.winner_id] = (pairs[k].w[d.winner_id] || 0) + 1;
    }
    const rival = Object.values(pairs).sort((a, b) => b.n - a.n)[0];
    if (rival && rival.n > 1) {
      const [a, b] = rival.ids;
      tiles.push(["BIGGEST RIVALRY", `${rival.n} DUELS`, `${B.name(a)} ${rival.w[a] || 0}–${rival.w[b] || 0} ${B.name(b)}`, "var(--purple)"]);
    }
    const quick = top("avg_guess_ms");
    if (quick) tiles.push(["QUICKEST DRAW", B.secs(quick.v), `${B.name(quick.p.user_id)} · average correct answer`, "var(--neon)"]);
    const weekPts = top("points", "weekly");
    if (weekPts) tiles.push(["PLAYER OF THE WEEK", B.playerLink(weekPts.p.user_id), `${B.fmt(weekPts.v)} points in 7 days`, "var(--pink)", "leaderboard.html#points|weekly"]);
    const open = bugs.reports.filter(r => r.status === "open").length, fixed = bugs.reports.filter(r => r.status === "fixed").length;
    tiles.push(["BUGS SQUASHED", String(fixed), `${open} still alive`, "var(--pink)", "bugs.html"]);

    app.append(el("h2", { class: "section" }, "HALL OF FAME"));
    app.append(el("div", { class: "tiles" }, tiles.map(([label, value, sub, c, href]) =>
      el("div", { class: "tile", style: { "--c": c } },
        href ? el("a", { class: "label", href, style: { color: c } }, `${label} ▸`) : el("span", { class: "label" }, label),
        el("span", { class: "value" }, value),
        el("span", { class: "sub" }, sub)))));

    // ---------- RECENT REPLAYS ----------
    app.append(el("h2", { class: "section" }, "RECENT REPLAYS", el("a", { href: "replays.html" }, "ALL REPLAYS ▸")));
    app.append(el("div", { class: "mlist" }, matches.slice(0, 6).map(m => {
      const k = B.matchKind(m);
      return el("a", { class: "mrow", href: B.matchHref(m), style: { "--c": k.color } },
        el("span", { class: "kind" }, k.label), el("span", { class: "what" }, B.matchTitle(m)), el("span", { class: "when" }, B.when(m.ended_at)));
    })));

    B.footer(`${fixed} BUGS SQUASHED · ${open} STILL ALIVE`);
  } catch (e) {
    B.fail(app, e);
  }
})();
</script>
</body>
</html>
