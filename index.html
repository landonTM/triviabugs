<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bertha · The Trivia Machine</title>
<!-- site-meta -->
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="theme-color" content="#7cff6b">
<meta name="description" content="High scores, every-stat leaderboards, player stats, seasons and match replays for Bertha, the Discord trivia bot.">
<meta property="og:site_name" content="Bertha">
<meta property="og:type" content="website">
<meta property="og:title" content="Bertha · The Trivia Machine">
<meta property="og:description" content="High scores, every-stat leaderboards, player stats, seasons and match replays for Bertha, the Discord trivia bot.">
<meta property="og:url" content="https://berthabot.me/">
<meta property="og:image" content="https://berthabot.me/assets/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<!-- site-meta -->
<link rel="stylesheet" href="assets/arcade.css?v=20261001c">
<script src="assets/bertha.js?v=20261001c"></script>
<style>
  .tagline { font-size: clamp(9px, 2.6vw, 12px); letter-spacing: clamp(1px, .6vw, 3px); }
  .marquee {
    margin: 28px auto 0; max-width: 520px; border: 4px solid var(--yellow); background: var(--panel);
    box-shadow: 6px 6px 0 rgba(255, 210, 63, .22), 0 0 28px rgba(255, 210, 63, .12);
    display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 16px 16px; text-align: center;
  }
  .mq-label { font: 10px/1.6 var(--pixel); color: var(--yellow); letter-spacing: 2px; }
  .mq-clock { font: clamp(30px, 9vw, 48px)/1 var(--pixel); color: var(--text); text-shadow: 3px 3px 0 var(--shadow), 0 0 16px rgba(255,255,255,.25); font-variant-numeric: tabular-nums; }
  .mq-sub { font: 8px/1.6 var(--pixel); color: var(--muted); }
  .insert { margin-top: 18px; font-size: clamp(10px, 2.4vw, 14px); }
  .ticker {
    display: flex; align-items: center; gap: 12px; margin: 26px auto 0; max-width: 720px; padding: 10px 14px;
    border: 3px solid var(--line-dim); border-left: 6px solid var(--c, var(--cyan)); background: var(--panel); color: var(--text);
    box-shadow: 4px 4px 0 rgba(59, 26, 143, .55);
  }
  .ticker:hover { text-decoration: none; color: var(--text); border-color: var(--line); border-left-color: var(--c, var(--cyan)); }
  .ticker .tk-k { font: 9px/1.6 var(--pixel); color: var(--c, var(--cyan)); white-space: nowrap; }
  .ticker .tk-t { flex: 1 1 auto; min-width: 0; font-size: 22px; line-height: 1.15; }
  .ticker .tk-t small { display: block; font-size: 18px; color: var(--muted); }
  .ticker .dot { width: 10px; height: 10px; flex: 0 0 auto; background: var(--c, var(--cyan)); box-shadow: 0 0 10px var(--c, var(--cyan)); }
  .ticker.fresh .dot { animation: blink 1.1s steps(1) infinite; }
  @media (prefers-reduced-motion: reduce) { .ticker.fresh .dot { animation: none; } }
</style>
</head>
<body>
<div class="wrap">
  <a class="logo" href="index.html">BERTHA</a>
  <div class="tagline">THE TRIVIA MACHINE</div>
  <div class="marquee">
    <span class="mq-label">NEXT DAILY TRIVIA</span>
    <span class="mq-clock" id="countdown">--:--:--</span>
    <span class="mq-sub">2 PM ET · DOUBLE XP · 50 QUESTIONS</span>
  </div>
  <div class="insert"><span class="blink">INSERT COIN</span></div>
  <a class="ticker" id="ticker" hidden></a>

  <main id="app"><div class="loading">LOADING…</div></main>
</div>

<script>
(async () => {
  const { el } = B;
  B.topbar("index.html");
  const app = B.$("#app");

  // live countdown to 2 PM ET
  const cd = B.$("#countdown");
  const tick = () => { cd.textContent = B.clock(B.secondsToDaily()); };
  tick(); setInterval(tick, 1000);

  try {
    await B.loadPlayers();
    const [lb, matches, bugs, missions] = await Promise.all([
      B.json("stats/leaderboard.json"),
      B.allMatches(),
      B.json("bug-reports.json").catch(() => ({ reports: [] })),
      B.json("missions.json").catch(() => ({ week: null })),
    ]);
    const levels = Object.fromEntries(lb.players.map(p => [p.user_id, p.level.level]));
    app.replaceChildren();

    // ---------- LAST GAME ticker (the data is published every 30 minutes, so "live" means "lately") ----------
    const last = matches[0];
    if (last) {
      const k = B.matchKind(last), tk = B.$("#ticker");
      const fresh = (Date.now() - (B.ts(last.ended_at) || 0)) < 3600000;
      tk.hidden = false;
      tk.href = B.matchHref(last);
      tk.style.setProperty("--c", k.color);
      tk.classList.toggle("fresh", fresh);
      const tick2 = () => tk.replaceChildren(el("span", { class: "dot" }),
        el("span", { class: "tk-t" }, el("span", { class: "tk-k" }, fresh ? "JUST PLAYED · " : "LAST GAME · ", k.label),
          el("small", {}, `${B.matchTitle(last)} · ${B.ago(last.ended_at)}`)),
        el("span", { class: "tk-k" }, "▸"));
      tick2(); setInterval(tick2, 30000);
    }

    // ---------- HIGH SCORES ----------
    app.append(el("h2", { class: "section", style: { justifyContent: "center", color: "var(--pink)", letterSpacing: "4px" } }, "HIGH SCORES"));
    const board = B.ranking(lb, B.METRIC.total_xp, "alltime").slice(0, 5);
    app.append(el("div", { class: "table-scroll" }, el("table", { class: "scores" },
      el("thead", {}, el("tr", {}, el("th", {}, "RANK"), el("th", { class: "num" }, "XP"), el("th", {}, "NAME"), el("th", { class: "num" }, "LV"))),
      el("tbody", {}, board.map(({ p }, i) => el("tr", { class: "row", style: { color: B.rankColor(i) }, onclick: () => (location.href = B.playerHref(p.user_id)) },
        el("td", { class: "rank" }, B.ordinal(i + 1)),
        el("td", { class: "big num" }, B.fmt(p.total_xp)),
        el("td", {}, el("div", { class: "who" }, B.avatar(p.user_id), B.playerLink(p.user_id))),
        el("td", { class: "big num" }, String(p.level.level))))))));
    app.append(el("p", { class: "center" }, el("a", { href: "leaderboard.html", style: { font: "11px var(--pixel)" } }, "EVERY LEADERBOARD ▸")));

    // ---------- LAST FIGHT ----------
    const duels = matches.filter(m => m.kind === "duel");
    const fight = duels.find(m => m.winner_id);
    if (fight) {
      app.append(el("h2", { class: "section" }, "LAST FIGHT", el("a", { href: "replays.html#duels" }, `ALL ${duels.length} DUELS ▸`)));
      app.append(B.fightCard(fight, levels));
      app.append(el("p", { class: "center" }, el("a", { href: B.matchHref(fight), style: { font: "11px var(--pixel)" } }, "WATCH THE REPLAY ▸")));
    }

    // ---------- THIS WEEK'S MISSIONS ----------
    const week = missions && missions.week;
    if (week && week.missions && week.missions.length) {
      const DIFF = { easy: "var(--neon)", medium: "var(--yellow)", hard: "var(--pink)" };
      app.append(el("h2", { class: "section" }, "THIS WEEK'S MISSIONS",
        el("span", { class: "pill", style: { color: "var(--muted)" } }, `RESETS ${B.when(week.week_end).toUpperCase()} ET`)));
      app.append(el("div", { class: "missions" }, week.missions.map(ms => {
        const done = ms.players.filter(x => x.completed_at);
        const lead = ms.players[0];
        return el("div", { class: "mission", style: { "--c": DIFF[ms.difficulty] || "var(--cyan)" } },
          el("span", { class: "diff" }, `${String(ms.difficulty).toUpperCase()} · +${B.fmt(ms.xp_reward)} XP`),
          el("span", { class: "txt" }, ms.text),
          el("span", { class: "who" }, done.length ? `${done.length} completed` : "Nobody's finished it yet",
            lead && !lead.completed_at ? el("span", {}, " · closest: ", B.playerLink(lead.user_id), ` ${B.fmt(lead.progress)}/${B.fmt(ms.target)}`) : null));
      })));
    }

    // ---------- HALL OF FAME ----------
    const top = (key, pd = "alltime") => B.ranking(lb, B.METRIC[key], pd)[0];
    const tiles = [];
    const daily = matches.find(m => m.kind === "game" && m.mode === "daily" && m.winner_id);
    if (daily) tiles.push(["DAILY CHAMP", B.playerLink(daily.winner_id), `${daily.rounds_played} rounds · ${B.day(daily.ended_at)}`, "var(--yellow)", null, "crown"]);
    const streak = top("best_streak");
    if (streak) tiles.push(["LONGEST COMBO", `${streak.v} IN A ROW`, B.name(streak.p.user_id), "var(--cyan)", null, "fire"]);
    const games = matches.filter(m => m.kind === "game").length;
    tiles.push(["MATCHES LOGGED", String(matches.length), `${games} games · ${duels.length} duels`, "var(--pink)", "replays.html", "play"]);
    const pairs = {};
    for (const d of duels) {
      const k = [d.challenger_id, d.opponent_id].sort().join("|");
      (pairs[k] = pairs[k] || { ids: k.split("|"), n: 0, w: {} }).n++;
      if (d.winner_id) pairs[k].w[d.winner_id] = (pairs[k].w[d.winner_id] || 0) + 1;
    }
    const rival = Object.values(pairs).sort((a, b) => b.n - a.n)[0];
    if (rival && rival.n > 1) {
      const [a, b] = rival.ids;
      tiles.push(["BIGGEST RIVALRY", `${rival.n} DUELS`, `${B.name(a)} ${rival.w[a] || 0}–${rival.w[b] || 0} ${B.name(b)}`, "var(--purple)", null, "swords"]);
    }
    const quick = top("avg_guess_ms");
    if (quick) tiles.push(["QUICKEST DRAW", B.secs(quick.v), `${B.name(quick.p.user_id)} · average correct answer`, "var(--neon)", null, "bolt"]);
    const weekPts = top("points", "weekly");
    if (weekPts) tiles.push(["PLAYER OF THE WEEK", B.playerLink(weekPts.p.user_id), `${B.fmt(weekPts.v)} points in 7 days`, "var(--pink)", "leaderboard.html#points|weekly", "trophy"]);
    const open = bugs.reports.filter(r => r.status === "open").length, fixed = bugs.reports.filter(r => r.status === "fixed").length;
    tiles.push(["BUGS SQUASHED", String(fixed), `${open} still alive`, "var(--pink)", "bugs.html", "bug"]);

    app.append(el("h2", { class: "section" }, "HALL OF FAME"));
    app.append(el("div", { class: "tiles" }, tiles.map(([label, value, sub, c, href, ic]) =>
      el("div", { class: "tile", style: { "--c": c } },
        href ? el("a", { class: "label", href, style: { color: c } }, B.icon(ic), ` ${label} ▸`) : el("span", { class: "label" }, B.icon(ic), ` ${label}`),
        el("span", { class: "value" }, value),
        el("span", { class: "sub" }, sub)))));

    // ---------- ACTIVITY: matches per day, last 30 days (or since replays began), stacked by mode ----------
    if (matches.length) {
      const MODES = [["daily", "DAILY TRIVIA"], ["standard", "TRIVIA"], ["quickfire", "QUICKFIRE"], ["hardcore", "HARDCORE"], ["duel", "DUELS"]];
      const keyOf = m => (m.kind === "duel" ? "duel" : m.mode);
      const perDay = {};
      for (const m of matches) {
        const d = B.etIso(m.ended_at);
        if (!d) continue;
        const row = (perDay[d] = perDay[d] || {});
        row[keyOf(m)] = (row[keyOf(m)] || 0) + 1;
      }
      const today = B.etIso(new Date().toISOString());
      const firstDay = Object.keys(perDay).sort()[0];
      const start = new Date(Math.max(Date.parse(`${firstDay}T00:00:00Z`), Date.parse(`${today}T00:00:00Z`) - 29 * 86400000)).toISOString().slice(0, 10);
      const cols = B.dayRange(start, today).map(d => ({
        label: B.shortDay(d), short: B.shortDay(d), d,
        segs: MODES.map(([k]) => ({ v: (perDay[d] || {})[k] || 0, color: B.MODE_COLORS[k] })),
      }));
      const total = cols.reduce((a, c) => a + c.segs.reduce((x, s) => x + s.v, 0), 0);
      app.append(el("h2", { class: "section" }, "ACTIVITY",
        el("span", { class: "pill", style: { color: "var(--muted)" } }, `${B.fmt(total)} MATCHES · ${cols.length} DAYS`)));
      app.append(B.barChart(cols, {
        legend: MODES.map(([k, label]) => [label, B.MODE_COLORS[k]]),
        readout: c => {
          const n = c.segs.reduce((a, s) => a + s.v, 0);
          const parts = MODES.map(([k, label], i) => [label, c.segs[i].v]).filter(([, v]) => v);
          return [el("span", { class: "k" }, c.label), n ? `${n} ${n === 1 ? "match" : "matches"}` : "no matches",
            parts.length ? el("span", { class: "dim" }, ` · ${parts.map(([l, v]) => `${v} ${l.toLowerCase()}`).join(", ")}`) : null];
        },
      }));
      app.append(el("p", { class: "page-sub", style: { marginTop: "12px" } }, "Days in Eastern time. Tap a bar for its numbers."));
    }

    // ---------- RECENT REPLAYS ----------
    app.append(el("h2", { class: "section" }, "RECENT REPLAYS", el("a", { href: "replays.html" }, "ALL REPLAYS ▸")));
    app.append(el("div", { class: "mlist" }, matches.slice(0, 6).map(B.matchRow)));

    B.footer(`${fixed} BUGS SQUASHED · ${open} STILL ALIVE`);
  } catch (e) {
    B.fail(app, e);
  }
})();
</script>
</body>
</html>
