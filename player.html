<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Player · Bertha</title>
<link rel="stylesheet" href="assets/arcade.css">
<script src="assets/bertha.js"></script>
<style>
  .hero { display: flex; flex-wrap: wrap; gap: 24px; align-items: center; margin-top: 40px; }
  .hero .info { flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
  .hero h1 { margin: 0; font-size: clamp(40px, 7vw, 64px); line-height: 1; font-weight: 400; overflow-wrap: anywhere; }
  .hero .lv { font: clamp(14px, 2.4vw, 20px)/1.4 var(--pixel); color: var(--neon); }
  .hero .meta { color: var(--muted); }
  table.periods { border-collapse: collapse; width: 100%; }
  table.periods th, table.periods td { padding: 8px 12px; text-align: right; border-bottom: 2px solid var(--line-dim); }
  table.periods th { font: 10px/1.6 var(--pixel); color: var(--muted); font-weight: 400; }
  table.periods td:first-child, table.periods th:first-child { text-align: left; }
  table.periods td:first-child { font: 11px/1.6 var(--pixel); color: var(--cyan); }
  .res-w { color: var(--neon); } .res-l { color: var(--pink); } .res-t { color: var(--yellow); }
</style>
</head>
<body>
<div class="wrap">
  <main id="app"><div class="loading">LOADING PLAYER…</div></main>
</div>

<script>
(async () => {
  const { el } = B;
  B.topbar("");
  const app = B.$("#app");
  const id = B.param("id");
  if (!id) { B.fail(app, new Error("no player id in the link")); return; }

  try {
    await Promise.all([B.loadPlayers(), B.restoreLock()]);
    const [u, lb, matches] = await Promise.all([
      B.json(`stats/users/${encodeURIComponent(id)}.json`),
      B.json("stats/leaderboard.json").catch(() => ({ players: [] })),
      B.allMatches().catch(() => []),
    ]);
    const ranked = lb.players.filter(p => p.total_xp > 0).sort((a, b) => b.total_xp - a.total_xp);
    if (ranked[0]) B.setHiscore(String(ranked[0].total_xp));
    const rank = ranked.findIndex(p => p.user_id === id) + 1;
    const s = u.stats_row || {};
    const lvl = u.level;
    document.title = `${B.name(id)} · Bertha`;
    app.replaceChildren();

    // ---------- HERO ----------
    const xpLine = lvl.maxed ? "MAX LEVEL" : `${B.fmt(lvl.xp_into_level)} / ${B.fmt(lvl.xp_for_level)} XP TO LV ${lvl.level + 1}`;
    app.append(el("section", { class: "hero" },
      B.avatar(id, "xl"),
      el("div", { class: "info" },
        el("h1", {}, B.name(id)),
        el("div", { class: "lv" }, `LV ${lvl.level}`, rank ? el("span", { style: { color: "var(--yellow)" } }, ` · RANK #${rank} OF ${ranked.length}`) : null),
        el("div", { class: "xpbar", role: "progressbar", "aria-valuemin": "0", "aria-valuemax": "100", "aria-valuenow": String(Math.round(100 * lvl.progress)), "aria-label": "Progress to next level" },
          el("span", { style: { width: `${lvl.maxed ? 100 : 100 * lvl.progress}%` } })),
        el("div", { class: "meta" }, `${xpLine} · ${B.fmt(u.total_xp)} XP TOTAL`),
        u.activity && u.activity.first_answered_at
          ? el("div", { class: "meta" }, `Playing since ${B.day(u.activity.first_answered_at)} · ${u.activity.active_days} active days`) : null)));

    // ---------- STATS ----------
    const ps = u.period_stats || {};
    const duel = u.duel_stats || { wins: 0, losses: 0, ties: 0, best_streak: 0 };
    const sp = u.spelling_accuracy || {};
    const tiles = [
      ["POINTS", B.fmt(ps.alltime_points), "all-time", "var(--yellow)"],
      ["CORRECT ANSWERS", B.fmt(ps.alltime_correct), "all-time", "var(--cyan)"],
      ["GAME WINS", B.fmt(s.game_wins || 0), `${B.fmt(s.games_played || 0)} games · ${B.pct(s.game_wins || 0, s.games_played || 0)} win rate`, "var(--neon)"],
      ["BEST COMBO", `${u.best_streak || 0} IN A ROW`, `current day streak: ${s.day_streak || 0}`, "var(--pink)"],
      ["DUELS", `${duel.wins}–${duel.losses}–${duel.ties}`, `best duel streak: ${duel.best_streak}`, "var(--purple)"],
      ["AVG GUESS", B.secs(u.average_guess_ms), "time to a correct answer", "var(--cyan)"],
      ["SPELLING", B.pct(sp.exact_count || 0, sp.total || 0), `${B.fmt(sp.exact_count)} of ${B.fmt(sp.total)} spelled exactly`, "var(--yellow)"],
      ["INSANE FINDS", B.fmt(u.total_insane_correct), u.best_insane_round ? `best: ${u.best_insane_round.guesses} in "${u.best_insane_round.question_text}"` : "", "var(--pink)"],
    ];
    if (u.best_category) tiles.push(["BEST CATEGORY", u.best_category.category, `${B.fmt(u.best_category.points)} points · ${B.fmt(u.best_category.correct)} correct`, "var(--neon)"]);
    if (u.kirkening_crownings && u.kirkening_crownings.length) tiles.push(["KIRKENING CROWNS", String(u.kirkening_crownings.length), `last: ${B.day(u.kirkening_crownings[u.kirkening_crownings.length - 1].crowned_at)}`, "var(--yellow)"]);

    app.append(el("h2", { class: "section" }, "STATS"));
    app.append(el("div", { class: "tiles" }, tiles.map(([label, value, sub, c]) =>
      el("div", { class: "tile", style: { "--c": c } }, el("span", { class: "label" }, label), el("span", { class: "value" }, value), el("span", { class: "sub" }, sub)))));

    // fastest guess, answer behind the spoiler lock
    if (u.fastest_guess) {
      const fg = u.fastest_guess;
      const box = el("div", { class: "tile", style: { "--c": "var(--neon)", marginTop: "16px" } });
      const draw = () => box.replaceChildren(
        el("span", { class: "label" }, "FASTEST CORRECT ANSWER"),
        el("span", { class: "value" }, B.secs(fg.response_time_ms)),
        el("span", { class: "sub" }, `${fg.category}: "${fg.question_text}" → `, B.answerNode(fg.correct_answers)));
      draw(); B.onLockChange(draw);
      app.append(box, B.lockBar());
    }

    // ---------- BY PERIOD ----------
    app.append(el("h2", { class: "section" }, "BY PERIOD"));
    const per = [["TODAY", "daily"], ["THIS WEEK", "weekly"], ["THIS MONTH", "monthly"], ["THIS YEAR", "yearly"], ["ALL-TIME", "alltime"]];
    app.append(el("div", { class: "table-scroll" }, el("table", { class: "periods" },
      el("thead", {}, el("tr", {}, el("th", {}, ""), el("th", {}, "POINTS"), el("th", {}, "CORRECT"))),
      el("tbody", {}, per.map(([label, k]) => el("tr", {}, el("td", {}, label), el("td", {}, B.fmt(ps[`${k}_points`] || 0)), el("td", {}, B.fmt(ps[`${k}_correct`] || 0))))))));

    // ---------- RECENT MATCHES ----------
    const mine = matches.filter(m => m.kind === "duel" ? (m.challenger_id === id || m.opponent_id === id) : m.winner_id === id || m.started_by === id).slice(0, 10);
    if (mine.length) {
      app.append(el("h2", { class: "section" }, "RECENT MATCHES"));
      app.append(el("div", { class: "mlist" }, mine.map(m => {
        const k = B.matchKind(m);
        let res = null;
        if (m.kind === "duel") {
          res = !m.challenger_score && !m.opponent_score ? null : m.is_tie ? ["TIE", "res-t"] : !m.winner_id ? ["—", ""] : m.winner_id === id ? ["WIN", "res-w"] : ["LOSS", "res-l"];
        } else if (m.winner_id === id) res = ["WIN", "res-w"];
        return el("a", { class: "mrow", href: B.matchHref(m), style: { "--c": k.color } },
          el("span", { class: "kind" }, k.label),
          el("span", { class: "what" }, res ? el("span", { class: res[1] }, `${res[0]} · `) : null, B.matchTitle(m)),
          el("span", { class: "when" }, B.when(m.ended_at)));
      })));
      app.append(el("p", { class: "page-sub" }, "Shows every duel, plus games this player won or started."));
    }

    // ---------- BADGES ----------
    const ach = u.achievements || { catalog: [], unlocked: {} };
    const got = ach.catalog.filter(a => ach.unlocked[a.key]).sort((a, b) => (B.ts(ach.unlocked[b.key]) || 0) - (B.ts(ach.unlocked[a.key]) || 0));
    const locked = ach.catalog.filter(a => !ach.unlocked[a.key]);
    const badge = (a, on) => el("div", { class: `badge${on ? " got" : ""}` },
      el("div", { class: "bn" }, a.name),
      el("div", { class: "bd" }, a.description),
      on ? el("div", { class: "bd", style: { color: "var(--text)" } }, `Unlocked ${B.day(ach.unlocked[a.key])}`) : null);
    app.append(el("h2", { class: "section" }, `BADGES ${got.length} / ${ach.catalog.length}`));
    const grid = el("div", { class: "badges" }, got.map(a => badge(a, true)));
    app.append(grid);
    if (locked.length) {
      const more = el("button", { class: "btn", type: "button", style: { marginTop: "14px" } }, `SHOW ${locked.length} LOCKED`);
      more.addEventListener("click", () => { grid.append(...locked.map(a => badge(a, false))); more.remove(); });
      app.append(more);
    }

    // ---------- COSMETICS ----------
    if (u.cosmetics && u.cosmetics.length) {
      const types = {};
      for (const c of u.cosmetics) {
        const t = (types[c.cosmetic_type] = types[c.cosmetic_type] || { have: 0, all: 0 });
        t.all++; if (c.unlocked) t.have++;
      }
      const LABELS = { footer: "FOOTERS", emoji: "EMOJI PACKS", theme: "THEMES", embedcolor: "EMBED COLORS", mvp: "MVP CARDS" };
      app.append(el("h2", { class: "section" }, "COSMETICS"));
      app.append(el("div", { class: "tiles" }, Object.entries(types).map(([t, n]) =>
        el("div", { class: "tile", style: { "--c": "var(--purple)" } },
          el("span", { class: "label" }, LABELS[t] || t.toUpperCase()), el("span", { class: "value" }, `${n.have} / ${n.all}`)))));
    }
    B.footer();
  } catch (e) {
    B.fail(app, e);
  }
})();
</script>
</body>
</html>
