<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Question Bank · Bertha</title>
<!-- site-meta -->
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="theme-color" content="#7cff6b">
<meta name="description" content="Everything Bertha can ask: every category, how big it is, and what's new. No questions, no answers.">
<meta property="og:site_name" content="Bertha">
<meta property="og:type" content="website">
<meta property="og:title" content="Question Bank · Bertha">
<meta property="og:description" content="Everything Bertha can ask: every category, how big it is, and what's new. No questions, no answers.">
<meta property="og:url" content="https://berthabot.me/bank.html">
<meta property="og:image" content="https://berthabot.me/assets/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<!-- site-meta -->
<link rel="stylesheet" href="assets/arcade.css?v=20261002h">
<script src="assets/bertha.js?v=20261002h"></script>
<style>
  .added { display: grid; gap: 12px; }
  .add-day { border: 4px solid var(--line); background: var(--panel); padding: 12px 16px; box-shadow: 6px 6px 0 var(--shadow); }
  .add-day .d { font: 10px/1.6 var(--pixel); color: var(--yellow); }
  .add-day .what { display: flex; flex-wrap: wrap; gap: 6px 10px; margin-top: 6px; }
  .chip { border: 2px solid var(--c, var(--line-dim)); padding: 1px 8px; font-size: 20px; line-height: 1.25; }
  .chip b { color: var(--c, var(--neon)); font-weight: 400; }
  .chip .new { font: 8px/1 var(--pixel); color: var(--bg); background: var(--pink); padding: 3px 4px; margin-left: 6px; vertical-align: 3px; }

  .add-day .more { padding: 4px 10px; font-size: 9px; }
  @media (max-width: 719px) { .btns.sorts { display: grid; grid-template-columns: 1fr 1fr; } .btns.sorts .btn { text-align: center; } }
  /* six boxes: 2 per row on phones (3 even rows); 4 per row wider, with the last two stretched to fill their row */
  @media (min-width: 720px) {
    .tiles.six { grid-template-columns: repeat(4, 1fr); }
    .tiles.six > :nth-child(5), .tiles.six > :nth-child(6) { grid-column: span 2; }
  }
  .bank-tools { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; margin-bottom: 16px; }
  .bank-tools input { font: 20px var(--body, inherit); color: var(--text); background: var(--panel); border: 3px solid var(--line-dim);
    padding: 6px 10px; min-width: 0; flex: 1 1 220px; }
  .bank-tools input:focus { outline: none; border-color: var(--neon); }
  .cats { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
  .cat { border: 4px solid var(--c, var(--line)); background: var(--panel); padding: 14px 16px; display: flex; flex-direction: column; gap: 8px;
    box-shadow: 6px 6px 0 var(--shadow); min-width: 0; }
  .cat.off { opacity: .55; }
  .cat .top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .cat .nm { font: 11px/1.6 var(--pixel); color: var(--c, var(--cyan)); overflow-wrap: anywhere; }
  .cat .n { font-size: 34px; line-height: 1; white-space: nowrap; }
  .cat .n small { font-size: 18px; color: var(--muted); }
  .cat .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { font: 8px/1 var(--pixel); padding: 4px 5px; border: 2px solid currentColor; }
  .cat .facts { color: var(--muted); font-size: 20px; line-height: 1.25; }
  .cat .facts b { color: var(--text); font-weight: 400; }
  .seen { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; font: 9px/1.6 var(--pixel); color: var(--muted); }
  .seen .bar { height: 12px; border: 2px solid var(--line-dim); background: var(--bg); }
  .seen .bar span { display: block; height: 100%; background: var(--c, var(--neon)); }
  .seen .p { color: var(--text); }
  @media (max-width: 719px) { .cats { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <main id="app"><div class="loading">LOADING THE BANK…</div></main>
</div>

<script>
(async () => {
  const { el } = B;
  B.topbar("bank.html");
  const app = B.$("#app");
  let data;
  try {
    data = await B.json("bank.json");
  } catch (e) { B.fail(app, e); return; }
  const cats = data.categories || [];
  const added = data.added || [];
  const sum = (list, k) => list.reduce((a, c) => a + (c[k] || 0), 0);
  const plural = (n, one, many = `${one}s`) => `${B.fmt(n)} ${n === 1 ? one : many}`;
  const COLORS = ["var(--cyan)", "var(--pink)", "var(--neon)", "var(--yellow)", "var(--purple)"];
  const colorOf = name => COLORS[[...name].reduce((a, ch) => (a * 31 + ch.charCodeAt(0)) >>> 0, 7) % COLORS.length];
  const today = B.etIso(new Date().toISOString());
  const daysAgo = iso => Math.round((Date.parse(`${today}T00:00:00Z`) - Date.parse(`${iso}T00:00:00Z`)) / 86400000);
  const firstDay = added.length ? added[0].day : null;
  // A category is NEW for two weeks after its first questions land -- but not the ones the bank started with.
  const isNew = c => c.first_added !== firstDay && daysAgo(c.first_added) <= 14;

  app.replaceChildren(
    el("h1", { class: "page-title" }, "QUESTION BANK"),
    el("p", { class: "page-sub" }, "Everything Bertha can ask you: every category, how big it is, and what's new. No questions and no answers -- you'll have to play for those."));

  // ---------- the bank at a glance ----------
  const questions = sum(cats, "questions"), insane = sum(cats, "insane_rounds"), insaneAnswers = sum(cats, "insane_answers");
  const facts = sum(cats, "fun_facts"), pics = sum(cats, "pictures"), asked = sum(cats, "asked");
  const recent = added.filter(a => daysAgo(a.day) < 30);
  const recentQ = recent.reduce((a, d) => a + d.categories.reduce((x, c) => x + c[1], 0), 0);
  const recentI = recent.reduce((a, d) => a + d.categories.reduce((x, c) => x + c[2], 0), 0);
  const tiles = [
    ["QUESTIONS", B.fmt(questions), `in ${cats.length} categories`, "var(--cyan)", "help"],
    ["INSANE ROUNDS", B.fmt(insane), `${B.fmt(insaneAnswers)} answers to find`, "var(--pink)", "fire"],
    ["FUN FACTS", B.fmt(facts), `${B.pct(facts, questions)} of questions have one`, "var(--yellow)", "star"],
    ["PICTURE ROUNDS", B.fmt(pics), "maps, flags, logos and Pokémon", "var(--purple)", "grid"],
    ["SEEN SO FAR", B.pct(asked, questions), `${B.fmt(asked)} of ${B.fmt(questions)} have come up here`, "var(--neon)", "target"],
    ["LAST 30 DAYS", `+${B.fmt(recentQ + recentI)}`, [recentQ ? plural(recentQ, "new question") : "", recentI ? plural(recentI, "new insane round") : ""].filter(Boolean).join(" · ") || "nothing new yet", "var(--pink)", "gem"],
  ];
  app.append(el("div", { class: "tiles six", style: { marginTop: "8px" } }, tiles.map(([label, value, sub, c, ic]) =>
    el("div", { class: "tile", style: { "--c": c } },
      el("span", { class: "label" }, B.icon(ic), ` ${label}`), el("span", { class: "value" }, value), el("span", { class: "sub" }, sub)))));

  // ---------- growth: the bank's size every day since it started, with that day's additions on top ----------
  if (firstDay) {
    const byDay = Object.fromEntries(added.map(a => [a.day, a.categories]));
    let running = 0;
    const cols = B.dayRange(firstDay, today).map(d => {
      const list = byDay[d] || [];
      const q = list.reduce((a, c) => a + c[1], 0), i = list.reduce((a, c) => a + c[2], 0);
      const before = running;
      running += q + i;
      return { label: B.shortDay(d), short: B.shortDay(d), d, q, i, total: running, list,
        segs: [{ v: before, color: "var(--line)" }, { v: q + i, color: "var(--neon)" }] };
    });
    app.append(el("h2", { class: "section" }, "BANK GROWTH",
      el("span", { class: "pill", style: { color: "var(--muted)" } }, `${B.fmt(running)} IN THE BANK`)));
    app.append(B.barChart(cols, {
      legend: [["ALREADY IN THE BANK", "var(--line)"], ["ADDED THAT DAY", "var(--neon)"]],
      readout: c => [el("span", { class: "k" }, c.label), `${B.fmt(c.total)} in the bank`,
        c.q || c.i ? el("span", { class: "dim" }, ` · +${[c.q ? plural(c.q, "question") : "", c.i ? plural(c.i, "insane round") : ""].filter(Boolean).join(", ")}`) : null],
    }));
    app.append(el("p", { class: "page-sub", style: { marginTop: "12px" } },
      "Counts questions and insane rounds that are still in the bank today, on the day (Eastern time) each was added. Tap a bar for its numbers."));
  }

  // ---------- recently added ----------
  // A big import day touches 20+ categories; the biggest 8 show, the rest are one tap away.
  const CHIPS = 8;
  function dayChips(a, startedOn) {
    const chips = a.categories.map(([name, q, i]) =>
      el("span", { class: "chip", style: { "--c": colorOf(name) } }, `${name} `,
        el("b", {}, [q ? `+${B.fmt(q)}` : "", i ? `+${plural(i, "insane round")}` : ""].filter(Boolean).join(" ")),
        startedOn.get(name) === a.day ? el("span", { class: "new" }, "NEW") : null));
    const box = el("div", { class: "what" }, chips.slice(0, CHIPS));
    if (chips.length > CHIPS) {
      const more = el("button", { class: "btn more", type: "button" }, `+${chips.length - CHIPS} MORE`);
      more.addEventListener("click", () => box.replaceChildren(...chips));
      box.append(more);
    }
    return box;
  }
  const latest = added.filter(a => a.day !== firstDay).slice(-6).reverse();
  if (latest.length) {
    const startedOn = new Map(cats.map(c => [c.name, c.first_added]));
    app.append(el("h2", { class: "section" }, "RECENTLY ADDED"));
    app.append(el("div", { class: "added" }, latest.map(a => el("div", { class: "add-day" },
      el("div", { class: "d" }, `${B.calDay(a.day).toUpperCase()}${daysAgo(a.day) === 0 ? " · TODAY" : daysAgo(a.day) === 1 ? " · YESTERDAY" : ""}`),
      dayChips(a, startedOn)))));
  }

  // ---------- every category ----------
  const SORTS = [
    ["big", "BIGGEST", (a, b) => b.questions + b.insane_rounds - (a.questions + a.insane_rounds)],
    ["az", "A–Z", () => 0],
    ["new", "NEWEST", (a, b) => b.last_added.localeCompare(a.last_added) || b.first_added.localeCompare(a.first_added)],
    // switched-off categories last: they can't come up here, so "least seen" says nothing about them
    ["unseen", "LEAST SEEN", (a, b) => a.off - b.off || (a.questions ? a.asked / a.questions : 1) - (b.questions ? b.asked / b.questions : 1)],
  ];
  const hash = B.hash().split("|");
  let sort = SORTS.some(([k]) => k === hash[0]) ? hash[0] : "big";
  let query = "";
  const list = el("div", { class: "cats" });
  const count = el("span", { class: "legend", style: { color: "var(--muted)" } });
  const sortBtns = el("div", { class: "btns sorts", role: "group", "aria-label": "Sort categories" });

  function card(c) {
    const color = colorOf(c.name);
    const tags = [];
    if (isNew(c)) tags.push(el("span", { class: "tag", style: { color: "var(--pink)" } }, "NEW"));
    else if (c.first_added !== c.last_added && daysAgo(c.last_added) <= 7) tags.push(el("span", { class: "tag", style: { color: "var(--neon)" } }, "UPDATED"));
    if (c.pictures) tags.push(el("span", { class: "tag", style: { color: "var(--purple)" } }, c.pictures === c.questions ? "ALL PICTURES" : "PICTURES"));
    if (c.insane_rounds) tags.push(el("span", { class: "tag", style: { color: "var(--pink)" } }, "INSANE"));
    if (c.off) tags.push(el("span", { class: "tag", style: { color: "var(--muted)" } }, "DISABLED IN THIS SERVER"));
    const facts = [];
    if (c.insane_rounds) facts.push([el("b", {}, plural(c.insane_rounds, "insane round")), ` (${B.fmt(c.insane_answers)} answers)`]);
    if (c.fun_facts) facts.push([el("b", {}, plural(c.fun_facts, "Fun Fact")), c.fun_facts === c.questions ? " (every question)" : ""]);
    if (c.pictures && c.pictures !== c.questions) facts.push([el("b", {}, B.fmt(c.pictures)), " with a picture"]);
    const pctSeen = c.questions ? (100 * c.asked) / c.questions : 0;
    return el("div", { class: `cat${c.off ? " off" : ""}`, style: { "--c": color } },
      el("div", { class: "top" }, el("span", { class: "nm" }, c.name.toUpperCase()),
        el("span", { class: "n" }, B.fmt(c.questions), el("small", {}, " Q"))),
      tags.length ? el("div", { class: "tags" }, tags) : null,
      facts.length ? el("div", { class: "facts" }, facts.flatMap((f, i) => (i ? [" · ", ...f] : f))) : null,
      el("div", { class: "seen" }, "SEEN", el("div", { class: "bar" }, el("span", { style: { width: `${Math.min(100, pctSeen)}%` } })),
        el("span", { class: "p" }, `${B.fmt(c.asked)} · ${B.pct(c.asked, c.questions)}`)));
  }

  function draw() {
    history.replaceState(null, "", sort === "big" ? location.pathname : `#${sort}`);
    sortBtns.replaceChildren(...SORTS.map(([k, label]) =>
      el("button", { class: "btn", type: "button", "aria-pressed": String(k === sort), onclick: () => { sort = k; draw(); } }, label)));
    const q = query.trim().toLowerCase();
    const cmp = SORTS.find(([k]) => k === sort)[2];
    const shown = cats.filter(c => !q || c.name.toLowerCase().includes(q))
      .sort((a, b) => cmp(a, b) || a.name.localeCompare(b.name));
    count.textContent = q ? `${shown.length} of ${cats.length}` : "";
    list.replaceChildren(...(shown.length ? shown.map(card) : [el("p", { class: "page-sub" }, "No category by that name.")]));
  }

  app.append(
    el("h2", { class: "section" }, "CATEGORIES", el("span", { class: "pill", style: { color: "var(--muted)" } }, `${cats.length} IN ALL`)),
    sortBtns,
    el("div", { class: "bank-tools", style: { marginTop: "12px" } },
      el("input", { type: "search", placeholder: "Find a category…", "aria-label": "Find a category",
        oninput: e => { query = e.target.value; draw(); } }), count),
    list,
    el("p", { class: "page-sub", style: { marginTop: "16px" } },
      "Q = regular questions. SEEN = how many of them have come up in this server so far, in games or duels. Insane rounds can come from any category that has them, whatever categories a game was started with."));
  draw();
  B.footer("THE BANK REFRESHES EVERY 30 MINUTES");
})();
</script>
</body>
</html>
