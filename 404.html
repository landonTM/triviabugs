<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- GitHub Pages serves this for any missing path, at any depth, so every link resolves from the site root -->
<base href="/">
<title>Game Over · Bertha</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="stylesheet" href="assets/arcade.css?v=20261002c">
<style>
  .over { min-height: 80vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; text-align: center; padding: 0 16px; }
  .over h1 { margin: 0; font: clamp(40px, 11vw, 96px)/1.1 var(--pixel); color: var(--pink); text-shadow: 5px 5px 0 var(--shadow); font-weight: 400; }
  .over p { margin: 0; color: var(--muted); font-size: 24px; }
  .over .cont { font: clamp(14px, 3vw, 22px)/1.6 var(--pixel); color: var(--yellow); }
</style>
</head>
<body>
<div class="over">
  <h1>GAME OVER</h1>
  <p>That page isn't in the machine.</p>
  <div class="cont">CONTINUE? <span id="n">9</span></div>
  <a class="btn" href="index.html">PRESS START</a>
</div>
<script>
  let n = 9;
  const t = setInterval(() => {
    n -= 1;
    document.getElementById("n").textContent = n;
    if (n <= 0) { clearInterval(t); location.href = document.baseURI; }
  }, 1000);
</script>
</body>
</html>
