<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bug Tracker · Bertha</title>
<link rel="stylesheet" href="assets/arcade.css">
<script src="assets/bertha.js"></script>
<style>
  .how { border: 3px dashed var(--line-dim); padding: 14px 18px; color: var(--muted); margin: 8px 0 28px; }
  .how b { color: var(--text); font-weight: 400; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 22px 0 12px; }
  .toolbar input[type=search], .toolbar select {
    font: 20px var(--term); color: var(--text); background: var(--panel); border: 3px solid var(--line-dim);
    padding: 6px 10px; min-height: 44px;
  }
  .toolbar input[type=search] { flex: 1 1 280px; min-width: 0; }
  .toolbar input:focus, .toolbar select:focus { border-color: var(--cyan); outline: none; }
  .count { font: 10px/1.6 var(--pixel); color: var(--muted); margin: 6px 0 14px; }
  .bug { border: 3px solid var(--line-dim); border-left: 8px solid var(--c, var(--pink)); background: var(--panel); padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
  .bug + .bug { margin-top: 12px; }
  .bug-top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
  .bug-id { font: 12px/1 var(--pixel); color: var(--c, var(--pink)); }
  .chip { font: 9px/1 var(--pixel); padding: 6px 8px; border: 2px solid var(--line-dim); color: var(--text); white-space: nowrap; }
  .chip.st { border-color: var(--c, var(--pink)); color: var(--c, var(--pink)); }
  .chip.dim { color: var(--muted); }
  .bug-who { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; color: var(--muted); }
  .bug-who .av { width: 26px; height: 26px; border-width: 2px; font-size: 11px; }
  .bug-q { font-size: 28px; line-height: 1.15; overflow-wrap: anywhere; }
  .bug-row { display: flex; gap: 12px; align-items: baseline; }
  .bug-row .k { font: 9px/1.8 var(--pixel); color: var(--muted); flex: 0 0 150px; }
  .bug-row .v { overflow-wrap: anywhere; }
  .bug-actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .bug-actions .btn { font-size: 9px; min-height: 36px; padding: 8px 10px; }
  .pager { display: flex; gap: 10px; align-items: center; justify-content: center; margin: 18px 0; font: 10px var(--pixel); color: var(--muted); }
  .lock { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-left: auto; }
  .lock input { font: 20px var(--term); color: var(--text); background: var(--panel); border: 3px solid var(--line-dim); padding: 6px 10px; min-height: 44px; width: 170px; }
  .hidden-ans { color: var(--muted); letter-spacing: 2px; }
  @media (max-width: 620px) { .bug-who { margin-left: 0; } .bug-row { flex-direction: column; gap: 2px; } .bug-row .k { flex: none; } .lock { margin-left: 0; } }
</style>
</head>
<body>
<div class="wrap">
  <h1 class="page-title">BUG TRACKER</h1>
  <div class="how">Spot a wrong answer or a broken question? <b>React to it with 🐛</b> in Discord, or right-click the message and choose
    <b>Apps → Report Bugged Question</b>. It shows up here within a minute or two, and moves to Fixed once it's sorted.</div>
  <div class="tiles" id="stats"></div>
  <div class="toolbar" style="margin-top:32px">
    <div class="btns" id="tabs" role="tablist" aria-label="Tracker sections"></div>
    <div class="lock" id="lock"></div>
  </div>
  <div class="toolbar" id="controls"></div>
  <div class="count" id="count" aria-live="polite"></div>
  <main id="list"><div class="loading">LOADING REPORTS…</div></main>
</div>

<script>
(async () => {
  const { el } = B;
  B.topbar("bugs.html");
  await B.loadPlayers();

  // ---------- answer spoiler gate (scrambling: bot utils/answer_lock.py) ----------
  const PASSWORD_HASH = "cf589f9995ede78a78ab4686b0cb8c762ba4d60b27ddde05076e98d1f8b601bc";
  let key = null;
  async function sha(str) { return new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str))); }
  const hex = b => [...b].map(x => x.toString(16).padStart(2, "0")).join("");
  async function unlock(pw, remember = true) {
    const d = await sha(pw);
    if (hex(d) !== PASSWORD_HASH) return false;
    key = d;
    if (remember) { try { localStorage.setItem("audit-password", pw); } catch (e) { /* storage blocked */ } }
    return true;
  }
  function unscramble(b64) {
    try {
      const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
      return new TextDecoder().decode(bytes.map((b, i) => b ^ key[i % key.length]));
    } catch (e) { return "(unreadable)"; }
  }
  const answers = (list, plain) => !list || !list.length ? null
    : key ? list.map(a => (plain ? a : unscramble(a))).join(" / ")
    : el("span", { class: "hidden-ans" }, "▒▒▒▒▒▒ HIDDEN");
  try { const saved = localStorage.getItem("audit-password"); if (saved) await unlock(saved, false); } catch (e) { /* storage blocked */ }
  function drawLock() {
    const box = B.$("#lock");
    if (key) {
      box.replaceChildren(el("button", { class: "btn", type: "button", onclick: () => {
        key = null; try { localStorage.removeItem("audit-password"); } catch (e) { /* storage blocked */ }
        drawLock(); render();
      } }, "HIDE ANSWERS"));
      return;
    }
    const input = el("input", { type: "password", placeholder: "Password", "aria-label": "Answer password", autocomplete: "off" });
    const err = el("span", { style: { color: "var(--pink)" }, hidden: true }, "WRONG");
    box.replaceChildren(el("form", { style: { display: "flex", gap: "8px" },
      onsubmit: async e => { e.preventDefault(); if (await unlock(input.value)) { drawLock(); render(); } else err.hidden = false; } },
      input, el("button", { class: "btn", type: "submit" }, "SHOW ANSWERS")), err);
  }
  drawLock();

  // ---------- helpers ----------
  function ago(iso) {
    const d = B.ts(iso); if (!d) return "";
    const mins = Math.round((Date.now() - d) / 60000);
    if (mins < 1) return "just now";
    if (mins < 60) return `${mins}m ago`;
    const h = Math.round(mins / 60); if (h < 24) return `${h}h ago`;
    const days = Math.round(h / 24); return days < 30 ? `${days}d ago` : B.day(iso);
  }
  function copyBtn(label, text) {
    return el("button", { class: "btn", type: "button", onclick: e => {
      const b = e.currentTarget;
      navigator.clipboard?.writeText(text).then(() => { const o = b.textContent; b.textContent = "COPIED!"; setTimeout(() => (b.textContent = o), 1200); }).catch(() => {});
    } }, label);
  }
  const row = (k, v) => (v == null || v === "" ? null : el("div", { class: "bug-row" }, el("span", { class: "k" }, k), el("span", { class: "v" }, v)));

  // ---------- data ----------
  let reports = [];
  try { reports = (await B.json("bug-reports.json")).reports || []; }
  catch (e) { B.fail(B.$("#list"), e); return; }
  const open = reports.filter(r => r.status !== "fixed");
  const fixedReports = reports.filter(r => r.status === "fixed");
  let fixedFindings = null, audit = null, custom = null;   // loaded on demand (the audit files are several MB)
  const fixedFindingsP = B.json("fixed-findings.json").then(F => (fixedFindings = F.findings || [])).catch(() => (fixedFindings = []));

  // ---------- stats ----------
  function drawStats() {
    const fixTimes = fixedReports.map(r => (B.ts(r.fixed_at) || 0) - (B.ts(r.reported_at) || 0)).filter(ms => ms > 0).sort((a, b) => a - b);
    const median = fixTimes.length ? fixTimes[Math.floor(fixTimes.length / 2)] : null;
    const hunters = {};
    for (const r of reports) hunters[r.reported_by] = (hunters[r.reported_by] || 0) + 1;
    const top = Object.entries(hunters).sort((a, b) => b[1] - a[1])[0];
    const tiles = [
      ["OPEN", String(open.length), "waiting for a fix", "var(--pink)"],
      ["FIXED REPORTS", String(fixedReports.length), `of ${reports.length} ever filed`, "var(--neon)"],
      ["TYPICAL FIX TIME", median ? B.dur(median) : "—", "median, report to fix", "var(--cyan)"],
      ["AUDIT FIXES", fixedFindings ? B.fmt(fixedFindings.length) : "…", "question-bank findings resolved", "var(--yellow)"],
    ];
    if (top) tiles.push(["TOP BUG HUNTER", B.playerLink(top[0]), `${top[1]} reports filed`, "var(--purple)"]);
    B.$("#stats").replaceChildren(...tiles.map(([l, v, s, c]) => el("div", { class: "tile", style: { "--c": c } },
      el("span", { class: "label" }, l), el("span", { class: "value" }, v), el("span", { class: "sub" }, s))));
  }
  drawStats();
  fixedFindingsP.then(() => { drawStats(); drawTabs(); });

  // ---------- tabs ----------
  const TABS = {
    live: { label: "LIVE", count: () => open.length },
    fixed: { label: "FIXED", count: () => fixedReports.length + (fixedFindings ? fixedFindings.length : 0) },
    reassign: { label: "REASSIGNMENTS", count: () => (custom ? reassignItems().length : null) },
  };
  let tab = TABS[location.hash.slice(1)] ? location.hash.slice(1) : "live";
  let q = "", who = "", sort = "newest", page = 0;
  const PAGE = 40;
  function drawTabs() {
    B.$("#tabs").replaceChildren(...Object.entries(TABS).map(([k, t]) => {
      const n = t.count();
      return el("button", { class: "btn", type: "button", role: "tab", "aria-selected": String(k === tab), "aria-pressed": String(k === tab),
        onclick: () => { tab = k; page = 0; q = ""; who = ""; history.replaceState(null, "", `#${k}`); drawTabs(); drawControls(); render(); } },
        t.label, n != null ? el("span", { style: { color: "var(--muted)" } }, ` ${B.fmt(n)}`) : null);
    }));
  }

  function drawControls() {
    const search = el("input", { type: "search", placeholder: tab === "reassign" ? "Search question, answer or category…" : "Search question, category or reporter…",
      "aria-label": "Search", value: q, oninput: e => { q = e.target.value.toLowerCase().trim(); page = 0; clearTimeout(drawControls.t); drawControls.t = setTimeout(render, 150); } });
    const ctl = [search];
    if (tab !== "reassign") {
      const people = [...new Map(reports.map(r => [r.reported_by, r.reported_by_name])).entries()].sort((a, b) => B.name(a[0]).localeCompare(B.name(b[0])));
      ctl.push(el("select", { "aria-label": "Reported by", onchange: e => { who = e.target.value; page = 0; render(); } },
        el("option", { value: "" }, "Everyone"), people.map(([id]) => el("option", { value: id, selected: id === who }, B.name(id)))));
      ctl.push(el("select", { "aria-label": "Sort", onchange: e => { sort = e.target.value; render(); } },
        el("option", { value: "newest" }, tab === "fixed" ? "Recently fixed" : "Newest first"),
        el("option", { value: "oldest" }, "Oldest first")));
    }
    B.$("#controls").replaceChildren(...ctl);
  }

  // ---------- cards ----------
  function reportCard(r) {
    const fixed = r.status === "fixed";
    const took = fixed && r.fixed_at ? (B.ts(r.fixed_at) - B.ts(r.reported_at)) : null;
    return el("article", { class: "bug", style: { "--c": fixed ? "var(--neon)" : "var(--pink)" } },
      el("div", { class: "bug-top" },
        el("span", { class: "bug-id" }, `#${r.id}`),
        el("span", { class: "chip st" }, fixed ? "FIXED" : "OPEN"),
        r.category ? el("span", { class: "chip" }, r.category.toUpperCase()) : null,
        el("span", { class: "chip dim" }, r.method === "reaction" ? "🐛 REACTION" : "COMMAND"),
        el("span", { class: "bug-who" }, B.avatar(r.reported_by), B.playerLink(r.reported_by), ` · ${ago(r.reported_at)}`)),
      r.question_text ? el("div", { class: "bug-q" }, r.question_text) : el("div", { class: "bug-q", style: { color: "var(--muted)" } }, "(question no longer in the database)"),
      row("CURRENT ANSWER", answers(r.correct_answers, false)),
      fixed ? row("FIXED", `${ago(r.fixed_at)}${took > 0 ? ` · took ${B.dur(took)}` : ""}`) : null,
      el("div", { class: "bug-actions" }, copyBtn("COPY ID", String(r.id)),
        r.message_id ? el("a", { class: "btn", href: `https://discord.com/channels/${r.guild_id}/${r.channel_id}/${r.message_id}`, target: "_blank", rel: "noopener" }, "OPEN IN DISCORD ↗") : null));
  }
  function findingCard(f) {
    return el("article", { class: "bug", style: { "--c": "var(--neon)" } },
      el("div", { class: "bug-top" },
        el("span", { class: "bug-id" }, f.id),
        el("span", { class: "chip st" }, "FIXED"),
        f.category ? el("span", { class: "chip" }, f.category.toUpperCase()) : null,
        el("span", { class: "chip dim" }, f.kindLabel),
        el("span", { class: "bug-who" }, `fixed ${ago(f.fixed_at)}`)),
      f.question_text ? el("div", { class: "bug-q" }, f.question_text) : el("div", { class: "bug-q", style: { color: "var(--muted)" } }, "(details not in the audit file)"),
      row("ANSWER AT THE TIME", answers(f.correct_answers, f.plain)),
      el("div", { class: "bug-actions" }, copyBtn("COPY ID", f.id)));
  }
  function reassignCard(r) {
    const qn = lookupCustom(r.question_id);
    const id = r.id.replace(/^N-/, "C-");
    const loc = qn ? `${qn.file}:${qn.line}` : "";
    return el("article", { class: "bug", style: { "--c": "var(--yellow)" } },
      el("div", { class: "bug-top" },
        el("span", { class: "bug-id" }, id),
        el("span", { class: "chip st" }, `${r.current_category.toUpperCase()} → ${r.destination.toUpperCase()}`),
        r.evidence ? el("span", { class: "chip dim" }, r.evidence.toUpperCase()) : null),
      el("div", { class: "bug-q" }, qn ? qn.question : "(question no longer found)"),
      qn ? row("ANSWER", answers(qn.answers, true)) : null,
      row("WHY", r.issue), row("SUGGESTED FIX", r.fix),
      el("div", { class: "bug-actions" }, copyBtn("COPY ID", id), loc ? copyBtn("COPY SOURCE LINE", loc) : null));
  }

  // ---------- the audit files, only when a tab needs them ----------
  let lookupCustom = () => null;
  let auditP = null;
  function loadAudits() {
    if (!auditP) {
      auditP = Promise.all([B.json("trivia-audit.json").catch(() => null), B.json("other-categories-audit.json").catch(() => null), fixedFindingsP])
        .then(([a, c]) => {
          audit = a; custom = c;
          if (c) {
            const inv = new Map(c.inventory.map(x => [x.id, x])), refs = new Map(c.references.map(x => [x.id, x]));
            lookupCustom = qid => (qid && qid[0] === "Y" ? refs.get(qid) : inv.get(qid));
          }
          drawTabs();
        });
    }
    return auditP;
  }
  function fixedFindingCards() {
    const yaml = audit ? new Map(audit.findings.map(f => [f.id, f])) : new Map();
    const cf = custom ? new Map(custom.findings.map(f => [f.id, f])) : new Map();
    const cat = custom ? new Map(custom.category_findings.map(f => [f.id, f])) : new Map();
    return (fixedFindings || []).map(f => {
      const id = f.finding_id;
      const out = { id, fixed_at: f.fixed_at, kindLabel: "AUDIT FINDING", plain: false, category: null, question_text: null, correct_answers: null };
      if (id.startsWith("C-")) {
        const x = cat.get(id.replace(/^C-/, "N-")), qn = x ? lookupCustom(x.question_id) : null;
        Object.assign(out, { kindLabel: "REASSIGNMENT", plain: true, category: x ? `${x.current_category} → ${x.destination}` : null,
          question_text: qn && qn.question, correct_answers: qn && qn.answers });
      } else if (id.startsWith("N-")) {
        const x = cf.get(id), qn = x ? lookupCustom(x.question_id) : null;
        Object.assign(out, { kindLabel: "CUSTOM AUDIT", plain: true, category: qn && qn.category, question_text: qn && qn.question, correct_answers: qn && qn.answers });
      } else {
        const x = yaml.get(id);
        Object.assign(out, { category: x && x.category, question_text: x && x.question, correct_answers: x && x.current_answers });
      }
      return out;
    });
  }
  const reassignItems = () => {
    const fixedIds = new Set((fixedFindings || []).map(f => f.finding_id));
    return (custom ? custom.category_findings : []).filter(r => !fixedIds.has(r.id.replace(/^N-/, "C-")));
  };

  // ---------- list ----------
  const list = B.$("#list");
  async function render() {
    let items, card;
    if (tab === "live") {
      items = open.map(r => ({ r, date: r.reported_at, who: r.reported_by, text: JSON.stringify(r) }));
      card = x => reportCard(x.r);
    } else {
      if (!custom && !audit) { list.replaceChildren(el("div", { class: "loading" }, "LOADING THE AUDIT FILES…")); await loadAudits(); }
      if (tab === "fixed") {
        items = [
          ...fixedReports.map(r => ({ r, date: r.fixed_at || r.reported_at, who: r.reported_by, text: JSON.stringify(r), rep: true })),
          ...fixedFindingCards().map(f => ({ r: f, date: f.fixed_at, who: null, text: JSON.stringify(f) })),
        ];
        card = x => (x.rep ? reportCard(x.r) : findingCard(x.r));
      } else {
        items = reassignItems().map(r => ({ r, date: null, text: JSON.stringify({ ...r, ...(lookupCustom(r.question_id) || {}) }) }));
        card = x => reassignCard(x.r);
      }
    }
    if (who) items = items.filter(x => x.who === who);
    if (q) items = items.filter(x => x.text.toLowerCase().includes(q));
    if (tab !== "reassign") items.sort((a, b) => ((B.ts(b.date) || 0) - (B.ts(a.date) || 0)) * (sort === "oldest" ? -1 : 1));
    const pages = Math.max(1, Math.ceil(items.length / PAGE));
    page = Math.min(page, pages - 1);
    B.$("#count").textContent = `${B.fmt(items.length)} ${tab === "reassign" ? "SUGGESTION" : "ITEM"}${items.length === 1 ? "" : "S"}`;
    if (!items.length) {
      list.replaceChildren(el("div", { class: "loading" }, tab === "live" && !q && !who ? "NO OPEN BUGS · ALL CLEAR" : "NO MATCHES"));
      return;
    }
    const pager = () => pages > 1 ? el("div", { class: "pager" },
      el("button", { class: "btn", type: "button", disabled: page === 0, onclick: () => { page--; render(); scrollTo({ top: 0 }); } }, "◀ PREV"),
      `PAGE ${page + 1} / ${pages}`,
      el("button", { class: "btn", type: "button", disabled: page >= pages - 1, onclick: () => { page++; render(); scrollTo({ top: 0 }); } }, "NEXT ▶")) : null;
    list.replaceChildren(...[pager(), ...items.slice(page * PAGE, page * PAGE + PAGE).map(card), pager()].filter(Boolean));
  }

  drawTabs(); drawControls(); render();
  B.footer(`${fixedReports.length} BUGS SQUASHED · ${open.length} STILL ALIVE`);
})();
</script>
</body>
</html>
