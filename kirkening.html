<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Kirkening · Bertha</title>
<!-- site-meta -->
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="theme-color" content="#7cff6b">
<meta name="description" content="Every September 10th, one message steals the crown. Every reign, every quote.">
<meta property="og:site_name" content="Bertha">
<meta property="og:type" content="website">
<meta property="og:title" content="The Kirkening · Bertha">
<meta property="og:description" content="Every September 10th, one message steals the crown. Every reign, every quote.">
<meta property="og:url" content="https://berthabot.me/kirkening.html">
<meta property="og:image" content="https://berthabot.me/assets/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<!-- site-meta -->
<link rel="stylesheet" href="assets/arcade.css?v=20261001a">
<script src="assets/bertha.js?v=20261001a"></script>
<style>
  .throne { display: grid; grid-template-columns: auto 1fr; gap: 28px; align-items: center; border: 4px solid var(--yellow); background: var(--panel-2); padding: 28px; margin-top: 24px; }
  .throne .crown { font: 14px/1.6 var(--pixel); color: var(--yellow); letter-spacing: 3px; }
  .throne .who { font-size: clamp(36px, 6vw, 60px); line-height: 1; overflow-wrap: anywhere; }
  .throne .who a { color: var(--text); }
  .throne .since { color: var(--muted); }
  .countdown { text-align: center; margin: 28px 0 0; font: clamp(12px, 2.4vw, 18px)/1.6 var(--pixel); }
  .countdown b { color: var(--yellow); font-weight: 400; }
  .reign { display: grid; grid-template-columns: 110px 1fr; gap: 6px 18px; align-items: center; padding: 12px 0; border-bottom: 2px solid var(--line-dim); }
  .reign .t { font: 11px/1.6 var(--pixel); color: var(--muted); }
  .reign .p { display: flex; align-items: center; gap: 12px; min-width: 0; font-size: 26px; }
  .reign .p a { color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .reign .bar { grid-column: 2; height: 12px; background: var(--line-dim); }
  .reign .bar span { display: block; height: 100%; background: var(--yellow); }
  .reign .meta { grid-column: 2; color: var(--muted); }
  .reign .quote { grid-column: 2; font-size: 24px; color: var(--text); overflow-wrap: anywhere; white-space: pre-line; }
  .reign .quote.text::before { content: "\201C"; color: var(--yellow); }
  .reign .quote.text::after { content: "\201D"; color: var(--yellow); }
  .reign .quote.long .body { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .reign .quote.long.open .body { display: inline; }
  .reign .more { font: 9px/1 var(--pixel); color: var(--cyan); background: none; border: 0; padding: 6px 0; cursor: pointer; display: block; }
  .reign .qmedia { display: block; max-width: min(100%, 320px); max-height: 240px; border: 3px solid var(--line-dim); }
  .spoiler { font: inherit; color: transparent; background: var(--line-dim); border: 0; padding: 0 4px; cursor: pointer; }
  .spoiler.shown { color: var(--text); background: #2a2440; cursor: text; }
  .reign.final .t { color: var(--yellow); }
  .reign.final { border-bottom-color: var(--yellow); }
  @media (max-width: 520px) { .throne { grid-template-columns: 1fr; } .reign { grid-template-columns: 1fr; } .reign .bar, .reign .meta, .reign .quote { grid-column: 1; } }
</style>
</head>
<body>
<div class="wrap">
  <h1 class="page-title" style="color:var(--yellow)">THE KIRKENING</h1>
  <p class="page-sub">Every September 10th, any message in the server can steal the crown. Whoever holds it when the day ends keeps it for a year.</p>
  <main id="app"><div class="loading">LOADING…</div></main>
</div>

<script>
(async () => {
  const { el } = B;
  B.topbar("kirkening.html");
  const app = B.$("#app");
  let k;
  try {
    await B.loadPlayers();
    k = await B.json("kirkening.json");
  } catch (e) { B.fail(app, e); return; }

  // A crowning quote, Discord-style: ||spoilers|| hidden until clicked, a lone GIF/video/image link
  // shown as the media itself, line breaks kept, and very long ones folded behind SHOW ALL.
  const MEDIA = /^https?:\/\/\S+\.(mp4|webm|gif|png|jpe?g|webp)(\?\S*)?$/i;
  function quoteNode(text) {
    const t = text.trim();
    if (MEDIA.test(t)) {
      const video = /\.(mp4|webm)(\?|$)/i.test(t);
      const media = video
        ? el("video", { class: "qmedia", src: t, autoplay: true, loop: true, muted: true, playsinline: true, "aria-label": "Crowning GIF" })
        : el("img", { class: "qmedia", src: t, alt: "Crowning GIF", loading: "lazy" });
      if (video) media.muted = true;
      media.addEventListener("error", () => media.replaceWith(el("a", { href: t, target: "_blank", rel: "noopener" }, "(open the GIF)")));
      return el("div", { class: "quote" }, media);
    }
    const body = el("span", { class: "body" }, t.split(/(\|\|[\s\S]+?\|\|)/).filter(Boolean).map(part =>
      part.startsWith("||") && part.endsWith("||") && part.length > 4
        ? el("button", { class: "spoiler", type: "button", "aria-label": "Spoiler, click to reveal",
            onclick: e => { e.currentTarget.classList.add("shown"); e.currentTarget.removeAttribute("aria-label"); } }, part.slice(2, -2))
        : part));
    const box = el("div", { class: `quote text${t.length > 280 ? " long" : ""}` }, body);
    if (t.length > 280) {
      box.append(el("button", { class: "more", type: "button", onclick: e => {
        const open = box.classList.toggle("open"); e.currentTarget.textContent = open ? "SHOW LESS" : "SHOW ALL";
      } }, "SHOW ALL"));
    }
    return box;
  }

  const out = [];
  const live = (k.events || []).find(e => e.live);

  // ---------- the throne ----------
  if (k.holder) {
    const since = B.ts(k.holder.updated_at);
    const days = since ? Math.floor((Date.now() - since) / 86400000) : null;
    out.push(el("section", { class: "throne" },
      B.avatar(k.holder.user_id, "xl"),
      el("div", { style: { display: "flex", flexDirection: "column", gap: "12px", minWidth: 0 } },
        el("span", { class: "crown" }, live ? "HOLDING THE CROWN RIGHT NOW" : "THE REIGNING KIRK"),
        el("span", { class: "who" }, B.playerLink(k.holder.user_id)),
        el("span", { class: "since" }, `Crowned ${B.when(k.holder.updated_at)} ET${days != null && !live ? ` · ${days} days on the throne` : ""}`))));
  }

  // ---------- countdown ----------
  const cd = el("div", { class: "countdown" });
  const next = B.ts(k.next_event);
  const tick = () => {
    if (live) { cd.replaceChildren(el("b", { class: "blink" }, "THE KIRKENING IS LIVE · ANY MESSAGE CAN STEAL THE CROWN")); return; }
    cd.replaceChildren("NEXT KIRKENING IN ", el("b", {}, B.clock(((next || 0) - Date.now()) / 1000)));
  };
  tick(); setInterval(tick, 1000);
  out.push(cd);

  // ---------- records + all-time table ----------
  const totals = k.totals || [];
  const allReigns = (k.events || []).flatMap(ev => ev.reigns.map(r => ({ ...r, year: ev.year })));
  if (totals.length) {
    const best = f => [...totals].sort((a, b) => f(b) - f(a))[0];
    const shortest = [...allReigns].filter(r => r.reign_ms > 0).sort((a, b) => a.reign_ms - b.reign_ms)[0];
    const recs = [
      ["MOST TIME AS KIRK", best(t => t.reign_ms), t => B.dur(t.reign_ms)],
      ["MOST CROWNS", best(t => t.crowns), t => `${t.crowns} CROWNS`],
      ["LONGEST SINGLE REIGN", best(t => t.longest_reign_ms), t => B.dur(t.longest_reign_ms)],
      ["MOST YEARS KEPT", best(t => t.years_won), t => `${t.years_won} YEAR${t.years_won === 1 ? "" : "S"}`],
    ];
    out.push(el("h2", { class: "section" }, "RECORDS"));
    out.push(el("div", { class: "tiles" },
      recs.filter(([, t]) => t).map(([label, t, show], i) => el("div", { class: "tile", style: { "--c": B.rankColor(i) } },
        el("span", { class: "label" }, label), el("span", { class: "value" }, show(t)), el("span", { class: "sub" }, B.playerLink(t.user_id)))),
      shortest ? el("div", { class: "tile", style: { "--c": "var(--purple)" } },
        el("span", { class: "label" }, "SHORTEST REIGN"), el("span", { class: "value" }, B.dur(shortest.reign_ms)),
        el("span", { class: "sub" }, B.playerLink(shortest.user_id), ` · ${shortest.year}`)) : null,
      el("div", { class: "tile", style: { "--c": "var(--cyan)" } },
        el("span", { class: "label" }, "CROWNINGS EVER"), el("span", { class: "value" }, String(allReigns.length)),
        el("span", { class: "sub" }, `${totals.length} different Kirks`))));

    const COLS = [
      ["reign_ms", "TIME HELD", t => B.dur(t.reign_ms)],
      ["crowns", "CROWNS", t => String(t.crowns)],
      ["longest_reign_ms", "LONGEST", t => B.dur(t.longest_reign_ms)],
      ["avg", "AVERAGE", t => B.dur(t.crowns ? t.reign_ms / t.crowns : 0)],
      ["years_won", "YEARS KEPT", t => String(t.years_won)],
    ];
    let sortKey = "reign_ms";
    const val = (t, key) => (key === "avg" ? (t.crowns ? t.reign_ms / t.crowns : 0) : t[key]);
    const tableBox = el("div", { class: "table-scroll" });
    const sortBtns = el("div", { class: "btns", role: "group", "aria-label": "Sort Kirks by" });
    const drawTable = () => {
      sortBtns.replaceChildren(...COLS.map(([key, label]) => el("button", { class: "btn", type: "button", "aria-pressed": String(key === sortKey),
        onclick: () => { sortKey = key; drawTable(); } }, label)));
      const rows = [...totals].sort((a, b) => val(b, sortKey) - val(a, sortKey) || b.reign_ms - a.reign_ms);
      tableBox.replaceChildren(el("table", { class: "scores" },
        el("thead", {}, el("tr", {}, el("th", {}, "RANK"), el("th", {}, "NAME"), COLS.map(([key, label]) =>
          el("th", { class: "num", style: { color: key === sortKey ? "var(--neon)" : "" } }, label)))),
        el("tbody", {}, rows.map((t, i) => el("tr", { style: { color: i < 5 ? B.rankColor(i) : "var(--text)" } },
          el("td", { class: "rank" }, B.ordinal(i + 1)),
          el("td", {}, el("div", { class: "who" }, B.avatar(t.user_id), B.playerLink(t.user_id))),
          COLS.map(([key, , show]) => el("td", { class: key === sortKey ? "big num" : "num dim" }, show(t))))))));
    };
    drawTable();
    out.push(el("h2", { class: "section" }, "ALL-TIME KIRKS"), sortBtns, el("div", { style: { height: "14px" } }), tableBox);
  }

  // ---------- each year ----------
  for (const ev of k.events || []) {
    const span = Math.max(1, (B.ts(ev.ends_at) - B.ts(ev.starts_at)));
    out.push(el("h2", { class: "section" }, `SEPT 10, ${ev.year}${ev.live ? " · LIVE" : ""}`,
      el("span", { class: "pill", style: { color: "var(--muted)" } }, `${ev.reigns.length} CROWNINGS`)));
    out.push(el("div", {}, ev.reigns.map((r, i) => {
      const final = !ev.live && i === ev.reigns.length - 1;
      return el("div", { class: `reign${final ? " final" : ""}` },
        el("span", { class: "t" }, B.time(r.crowned_at)),
        el("span", { class: "p" }, B.avatar(r.user_id), B.playerLink(r.user_id)),
        el("div", { class: "bar", title: B.dur(r.reign_ms) }, el("span", { style: { width: `${Math.max(1, (100 * r.reign_ms) / span)}%` } })),
        el("span", { class: "meta" }, `Held ${B.dur(r.reign_ms)}`, final ? " · KEPT THE CROWN FOR THE YEAR" : ""),
        r.message_content ? quoteNode(r.message_content) : null);
    })));
  }
  if (!(k.events || []).length) out.push(el("div", { class: "loading" }, "NO CROWNINGS YET"));

  app.replaceChildren(...out);
  B.footer("LONG LIVE THE KIRK");
})();
</script>
</body>
</html>
