<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stats · Bertha</title>
<!-- site-meta -->
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="theme-color" content="#7cff6b">
<meta name="description" content="Everything Bertha knows about every player.">
<meta property="og:site_name" content="Bertha">
<meta property="og:type" content="website">
<meta property="og:title" content="Stats · Bertha">
<meta property="og:description" content="Everything Bertha knows about every player.">
<meta property="og:url" content="https://berthabot.me/stats.html">
<meta property="og:image" content="https://berthabot.me/assets/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<!-- site-meta -->
<link rel="stylesheet" href="assets/arcade.css?v=20261002b">
<script src="assets/bertha.js?v=20261002b"></script>
<style>
  /* character-select card: the player's embed colour (--neon on this page) is the accent */
  .select { margin-top: 28px; border: 4px solid var(--neon); background: var(--panel);
    box-shadow: 8px 8px 0 color-mix(in srgb, var(--neon) 25%, transparent), 0 0 40px color-mix(in srgb, var(--neon) 10%, transparent); }
  .select .bar-top { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 8px 14px;
    background: var(--neon); color: var(--bg); font: 10px/1.6 var(--pixel); }
  .select .body { display: flex; flex-wrap: wrap; gap: 22px; align-items: center; padding: 22px; }
  .select .portrait { position: relative; flex: 0 0 auto; }
  .select .portrait .av { border-color: var(--neon); box-shadow: 6px 6px 0 var(--shadow); }
  .select .portrait .lvbadge { position: absolute; right: -12px; bottom: -12px; padding: 6px 8px; font: 12px/1 var(--pixel);
    background: var(--bg); color: var(--neon); border: 3px solid var(--neon); }
  .select .info { flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
  .select h1 { margin: 0; font-size: clamp(40px, 7vw, 64px); line-height: 1; font-weight: 400; overflow-wrap: anywhere;
    text-shadow: 3px 3px 0 var(--shadow); }
  .select .meta { color: var(--muted); }
  .segbar { position: relative; height: 26px; border: 3px solid var(--line); background: var(--line-dim); }
  .segbar span { display: block; height: 100%; background: var(--neon); box-shadow: 0 0 12px color-mix(in srgb, var(--neon) 60%, transparent); }
  .segbar::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(90deg, transparent 0 calc(5% - 3px), var(--panel) calc(5% - 3px) 5%); }
  .select .chips { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 3px solid var(--line-dim); }
  .select .chip-stat { padding: 12px 16px; border-right: 3px solid var(--line-dim); border-bottom: 3px solid var(--line-dim); display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .select .chip-stat:nth-child(3n) { border-right: 0; }
  .select .chip-stat .l { font: 8px/1.6 var(--pixel); color: var(--muted); display: flex; gap: 6px; align-items: center; }
  .select .chip-stat .l .px-icon { width: 10px; height: 10px; color: var(--neon); }
  .select .chip-stat .v { font-size: 30px; line-height: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .select .chip-stat .r { font: 8px/1.6 var(--pixel); color: var(--muted); min-height: 1.6em; }
  .select .chip-stat .r.top { color: var(--yellow); }
  .select .btns { padding: 18px 22px 22px; }
  @media (max-width: 620px) {
    .select .body { padding: 18px 16px 22px; gap: 22px; }
    .select .portrait .av.xl { width: 104px; height: 104px; }
    .select .chips { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .select .chip-stat:nth-child(3n) { border-right: 3px solid var(--line-dim); }
    .select .chip-stat:nth-child(2n) { border-right: 0; }
    .select .chip-stat { padding: 10px 12px; }
    .select .chip-stat .v { font-size: 26px; }
    .select .btns { padding: 16px; }
  }
  .loadout { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
  .swatch { display: inline-block; width: 28px; height: 28px; border: 3px solid var(--line); vertical-align: middle; margin-right: 10px; }
  .card-mvp { grid-column: 1 / -1; display: grid; grid-template-columns: 260px 1fr; gap: 18px; align-items: center; }
  .card-mvp img { width: 100%; border: 3px solid var(--line-dim); }
  .card-mvp .q { font-size: 28px; line-height: 1.15; white-space: pre-line; }
  @media (max-width: 620px) { .card-mvp { grid-template-columns: 1fr; } }
  .picker { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
  .pcard { display: flex; align-items: center; gap: 14px; border: 3px solid var(--line-dim); background: var(--panel); padding: 14px; color: var(--text); min-width: 0; }
  .pcard:hover { border-color: var(--line); text-decoration: none; color: var(--text); }
  .pcard .n { font-size: 28px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pcard .s { font: 10px/1.6 var(--pixel); color: var(--muted); }
  .sticky { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 12px 0; border-bottom: 3px solid var(--line-dim); display: flex; flex-direction: column; gap: 10px; }
  .sticky .btns { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
  .jump { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .jump .chip { flex: 0 0 auto; font: 9px/1 var(--pixel); color: var(--muted); border: 2px solid var(--line-dim); padding: 8px 10px; white-space: nowrap; }
  .jump .chip:hover { color: var(--text); border-color: var(--line); text-decoration: none; }
  #app h2.section { scroll-margin-top: 150px; }
  .tile .rank { font: 9px/1.6 var(--pixel); color: var(--muted); }
  .tile .rank.top { color: var(--yellow); }
  table.grid { border-collapse: collapse; width: 100%; }
  table.grid th, table.grid td { padding: 8px 12px; text-align: right; border-bottom: 2px solid var(--line-dim); }
  table.grid th { font: 10px/1.6 var(--pixel); color: var(--muted); font-weight: 400; }
  table.grid td:first-child, table.grid th:first-child { text-align: left; }
  .res-w { color: var(--neon); } .res-l { color: var(--pink); } .res-t { color: var(--yellow); }
</style>
</head>
<body>
<div class="wrap">
  <main id="app"><div class="loading">LOADING…</div></main>
</div>

<script>
(async () => {
  const { el } = B;
  B.topbar("stats.html");
  const app = B.$("#app");
  const id = B.param("id");

  let lb;
  try {
    await B.loadPlayers();
    lb = await B.json("stats/leaderboard.json");
  } catch (e) { B.fail(app, e); return; }

  // ---------- no player picked: the picker ----------
  if (!id) {
    const xpRank = B.ranking(lb, B.METRIC.total_xp, "alltime");
    const ranked = new Map(xpRank.map((r, i) => [r.p.user_id, i + 1]));
    const people = [...lb.players].sort((a, b) => b.total_xp - a.total_xp || (b.periods.alltime.points || 0) - (a.periods.alltime.points || 0));
    app.replaceChildren(
      el("h1", { class: "page-title" }, "STATS"),
      el("p", { class: "page-sub" }, "Pick a player to see every number Bertha keeps on them."),
      el("p", {}, el("a", { class: "btn", href: "compare.html" }, "⚔ COMPARE PLAYERS")),
      el("div", { class: "picker" }, people.map(p => el("a", { class: "pcard", href: B.playerHref(p.user_id) },
        B.avatar(p.user_id, "lg"),
        el("span", { style: { display: "flex", flexDirection: "column", gap: "6px", minWidth: 0 } },
          el("span", { class: "n" }, B.name(p.user_id)),
          el("span", { class: "s" }, `LV ${p.level.level}${ranked.get(p.user_id) ? ` · #${ranked.get(p.user_id)} XP` : ""}`),
          el("span", { class: "s" }, `${B.fmt(p.periods.alltime.points || 0)} PTS · ${B.fmt(p.periods.alltime.correct || 0)} CORRECT`))))));
    B.footer();
    return;
  }

  // ---------- one player ----------
  let u, matches, seasonList;
  try {
    [u, matches, seasonList] = await Promise.all([
      B.json(`stats/users/${encodeURIComponent(id)}.json`),
      B.allMatches().catch(() => []),
      B.json("season.json").then(d => d.seasons || []).catch(() => []),
    ]);
  } catch (e) { B.fail(app, e); return; }
  const seasonsByKey = Object.fromEntries(seasonList.map(s => [s.key, s]));
  const me = lb.players.find(p => p.user_id === id);
  if (!me) { B.fail(app, new Error("this player isn't on the leaderboard yet")); return; }
  document.title = `${B.name(id)} · Stats · Bertha`;
  let period = B.PERIODS.some(([k]) => k === location.hash.slice(1)) ? location.hash.slice(1) : "alltime";

  const lvl = me.level;
  const xpRank = B.rankOf(lb, B.METRIC.total_xp, "alltime", id);
  const switcher = el("select", { class: "btn", "aria-label": "Switch player", onchange: e => (location.href = B.playerHref(e.target.value)) },
    [...lb.players].sort((a, b) => B.name(a.user_id).localeCompare(B.name(b.user_id)))
      .map(p => el("option", { value: p.user_id, selected: p.user_id === id }, B.name(p.user_id))));
  // their equipped cosmetics: embed colour tints the page, MVP card in the header, the rest in LOADOUT
  const eq = u.equipped || {};
  const mvp = eq.mvp && eq.mvp.quote ? eq.mvp : null;
  if (eq.embedcolor && eq.embedcolor.hex) document.documentElement.style.setProperty("--neon", eq.embedcolor.hex);
  const fill = t => String(t || "").replaceAll("{user}", B.name(id)).replaceAll("{loser}", "the runner-up");
  // Headline numbers, all-time, each with where it ranks.
  const HEAD = [["points", "coin", "POINTS"], ["correct", "target", "CORRECT"], ["game_wins", "trophy", "GAME WINS"],
    ["best_streak", "fire", "BEST STREAK"], ["avg_guess_ms", "bolt", "AVG ANSWER"], ["elo", "swords", "DUEL RATING"]];
  const chips = HEAD.map(([key, ic, label]) => {
    const m = B.METRIC[key];
    const v = m.get(me, "alltime");
    const ok = !m.qualify || m.qualify(me, "alltime");
    const r = v && ok ? B.rankOf(lb, m, "alltime", id) : 0;
    return el("div", { class: "chip-stat" },
      el("span", { class: "l" }, B.icon(ic), label),
      el("span", { class: "v" }, v ? m.show(v) : "—"),
      el("span", { class: `r${r === 1 ? " top" : ""}` }, r ? `#${r} OF ${B.ranking(lb, m, "alltime").length}` : ""));
  });
  const hero = el("section", { class: "select" },
    el("div", { class: "bar-top" }, el("span", {}, "PLAYER SELECT"), el("span", {}, xpRank ? `#${xpRank} IN XP` : "UNRANKED")),
    el("div", { class: "body" },
      el("div", { class: "portrait" }, B.avatar(id, "xl"), el("span", { class: "lvbadge" }, `LV ${lvl.level}`)),
      el("div", { class: "info" },
        el("h1", {}, B.name(id)),
        el("div", { class: "segbar", role: "progressbar", "aria-valuemin": "0", "aria-valuemax": "100",
          "aria-valuenow": String(Math.round(100 * (lvl.progress || 0))), "aria-label": "Progress to next level" },
          el("span", { style: { width: `${lvl.maxed ? 100 : 100 * (lvl.progress || 0)}%` } })),
        el("div", { class: "meta" }, lvl.maxed ? `MAX LEVEL · ${B.fmt(me.total_xp)} XP total`
          : `${B.fmt(lvl.xp_into_level)} / ${B.fmt(lvl.xp_for_level)} XP to LV ${lvl.level + 1} · ${B.fmt(me.total_xp)} XP total`),
        u.activity && u.activity.first_answered_at
          ? el("div", { class: "meta" }, `Playing since ${B.day(u.activity.first_answered_at)}${me.current.last_played ? ` · last played ${B.calDay(me.current.last_played)}` : ""}`) : null)),
    el("div", { class: "chips" }, chips),
    el("div", { class: "btns" }, switcher, el("a", { class: "btn", href: `compare.html?ids=${encodeURIComponent(id)}` }, "⚔ COMPARE"),
      B.shareButton(`p/${encodeURIComponent(id)}`, `${B.name(id)} · Bertha`)));

  // ---------- ACTIVITY: points per day (UTC days, like the TODAY leaderboard; the bot's site_metrics.daily_activity) ----------
  function activitySection() {
    const daily = u.daily || [];
    if (!daily.length) return [];
    const byDay = Object.fromEntries(daily.map(([d, pts, n]) => [d, [pts, n]]));
    const today = new Date().toISOString().slice(0, 10);
    const RANGES = [[30, "30 DAYS"], [90, "90 DAYS"], [0, "ALL"]];
    let range = 30;
    const box = el("div");
    const btns = el("div", { class: "btns", role: "group", "aria-label": "Range", style: { marginBottom: "14px" } });
    const draw = () => {
      btns.replaceChildren(...RANGES.map(([n, label]) => el("button", { class: "btn", type: "button", "aria-pressed": String(n === range),
        onclick: () => { range = n; draw(); } }, label)));
      const start = range ? new Date(Date.parse(`${today}T00:00:00Z`) - (range - 1) * 86400000).toISOString().slice(0, 10) : daily[0][0];
      const days = B.dayRange(start, today);
      const cols = days.map(d => ({ label: B.shortDay(d), short: B.shortDay(d), d,
        segs: [{ v: (byDay[d] || [0])[0], color: "var(--neon)" }] }));
      const played = days.filter(d => byDay[d]);
      const pts = played.reduce((a, d) => a + byDay[d][0], 0), cor = played.reduce((a, d) => a + byDay[d][1], 0);
      box.replaceChildren(B.barChart(cols, {
        readout: c => {
          const [p, n] = byDay[c.d] || [0, 0];
          return [el("span", { class: "k" }, c.label), p || n ? `${B.fmt(p)} pts · ${B.fmt(n)} correct` : el("span", { class: "dim" }, "didn't play")];
        },
      }), el("p", { class: "page-sub", style: { marginTop: "12px" } },
        `Played ${played.length} of ${days.length} days · ${B.fmt(pts)} points · ${B.fmt(cor)} correct. Days are UTC, like the TODAY leaderboard. Tap a bar for its numbers.`));
    };
    draw();
    return [el("h2", { class: "section" }, "ACTIVITY"), btns, box];
  }

  const body = el("div");
  const periodBar = el("div", { class: "sticky" });
  const loadout = [];
  if (eq.footer) loadout.push(el("div", { class: "tile", style: { "--c": "var(--neon)" } }, el("span", { class: "label" }, "FOOTER"),
    el("span", { class: "sub", style: { color: "var(--text)", fontSize: "24px" } }, eq.footer.template ? fill(eq.footer.template) : "Powered By Bertha! 🎲"),
    el("span", { class: "sub" }, eq.footer.label)));
  if (eq.emoji) loadout.push(el("div", { class: "tile", style: { "--c": "var(--neon)" } }, el("span", { class: "label" }, "EMOJI PACK"),
    el("span", { class: "value", style: { whiteSpace: "normal" } }, B.emoji(`${eq.emoji.correct || ""} ${eq.emoji.streak || ""} ${eq.emoji.speed || ""}`)),
    el("span", { class: "sub" }, `${eq.emoji.label} · correct, streak, speed record`)));
  if (eq.theme) loadout.push(el("div", { class: "tile", style: { "--c": "var(--neon)" } }, el("span", { class: "label" }, "RESPONSE THEME"),
    el("span", { class: "value", style: { fontSize: "28px", whiteSpace: "normal" } }, eq.theme.label.replace(/ Response Theme$/, "")), el("span", { class: "sub" }, eq.theme.label)));
  if (eq.embedcolor) loadout.push(el("div", { class: "tile", style: { "--c": "var(--neon)" } }, el("span", { class: "label" }, "EMBED COLOR"),
    el("span", { class: "value", style: { fontSize: "28px" } }, eq.embedcolor.hex ? el("span", { class: "swatch", style: { background: eq.embedcolor.hex } }) : null,
      eq.embedcolor.hex || "DEFAULT"), el("span", { class: "sub" }, eq.embedcolor.label)));
  if (mvp) loadout.push(el("div", { class: "tile card-mvp", style: { "--c": "var(--neon)" } },
    mvp.gif ? el("img", { src: mvp.gif, alt: `${mvp.label} GIF`, loading: "lazy" }) : el("span"),
    el("div", { style: { display: "flex", flexDirection: "column", gap: "8px" } },
      el("span", { class: "label" }, "MVP CARD · SHOWN WHEN THEY WIN"), el("span", { class: "q" }, fill(mvp.quote)), el("span", { class: "sub" }, mvp.label))));
  const loadoutBox = loadout.length ? [el("h2", { class: "section" }, "LOADOUT"), el("div", { class: "loadout" }, loadout)] : [];

  app.replaceChildren(hero, ...activitySection(), ...loadoutBox, periodBar, body);

  function tile(m, pd, color) {
    const v = m.get(me, m.period ? pd : "alltime");
    const qualifies = !m.qualify || m.qualify(me, m.period ? pd : "alltime");
    const r = v && qualifies ? B.rankOf(lb, m, pd, id) : 0;
    const of = r ? B.ranking(lb, m, pd).length : 0;
    return el("div", { class: "tile", style: { "--c": color } },
      el("span", { class: "label" }, m.label),
      el("span", { class: "value" }, v ? m.show(v) : (m.show === B.fmt ? "0" : "—")),
      el("span", { class: `rank${r === 1 ? " top" : ""}` },
        r ? `#${r} OF ${of}${m.period ? "" : " · ALL-TIME"}` : (!qualifies && v ? "NOT ENOUGH GAMES TO RANK" : m.period ? "" : "ALL-TIME")));
  }

  function draw() {
    history.replaceState(null, "", `?id=${encodeURIComponent(id)}#${period}`);
    periodBar.replaceChildren(B.periodButtons(period, k => { period = k; draw(); }));
    const out = [];
    const COLORS = ["var(--yellow)", "var(--cyan)", "var(--pink)", "var(--neon)", "var(--purple)"];
    B.GROUPS.filter(([g]) => g !== "categories").forEach(([g, label], gi) => {
      const ms = B.METRICS.filter(m => m.group === g);
      out.push(el("h2", { class: "section" }, label, g === "games"
        ? el("span", { class: "pill", style: { color: "var(--muted)" } }, "MODES SINCE SEP 22") : null));
      out.push(el("div", { class: "tiles" }, ms.map(m => tile(m, period, COLORS[gi % COLORS.length]))));
    });

    // highlights: the questions behind the records (never the answers)
    const hl = [];
    if (u.fastest_guess) hl.push(["FASTEST ANSWER EVER", B.secs(u.fastest_guess.response_time_ms), `${u.fastest_guess.category}: "${u.fastest_guess.question_text}"`]);
    if (u.best_insane_round) hl.push(["BEST INSANE ROUND EVER", `${u.best_insane_round.guesses} FOUND`, `${u.best_insane_round.category}: "${u.best_insane_round.question_text}"`]);
    if (u.best_category) hl.push(["BEST CATEGORY EVER", u.best_category.category, `${B.fmt(u.best_category.points)} points · ${B.fmt(u.best_category.correct)} correct`]);
    if (hl.length) {
      out.push(el("h2", { class: "section" }, "RECORDS"));
      out.push(el("div", { class: "tiles" }, hl.map(([l, v, s]) => el("div", { class: "tile", style: { "--c": "var(--neon)" } },
        el("span", { class: "label" }, l), el("span", { class: "value" }, v), el("span", { class: "sub" }, s)))));
    }

    // top 10 fastest answers (standard rounds of Trivia / Quickfire / Hardcore / Daily; never the answer itself)
    const fast = u.fastest_answers || [];
    if (fast.length) {
      out.push(el("h2", { class: "section" }, `TOP ${fast.length} FASTEST ANSWERS`,
        el("span", { class: "pill", style: { color: "var(--muted)" } }, "ALL-TIME")));
      out.push(el("div", { class: "fastlist" }, fast.map((f, i) => B.fastestRow(f, i))));
    }

    // where the XP came from -- all-time, not per period (xp_log / season_xp_log / pumpkin_log)
    const xs = u.xp_sources;
    if (xs) {
      const sorted = obj => Object.entries(obj || {}).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]);
      const bars = (rows, color) => {
        const total = rows.reduce((a, [, v]) => a + v, 0);
        return el("div", { class: "srcs", style: { "--c": color } }, rows.map(([lab, v]) => el("div", { class: "src" },
          el("span", { class: "lab" }, lab),
          el("div", { class: "bar" }, el("span", { style: { width: `${total ? (100 * v) / total : 0}%` } })),
          el("span", { class: "amt" }, B.fmt(v)), el("span", { class: "pc" }, B.pct(v, total)))));
      };
      out.push(el("h2", { class: "section" }, "WHERE THE XP CAME FROM",
        el("span", { class: "pill", style: { color: "var(--muted)" } }, "ALL-TIME")));
      out.push(el("div", { class: "btn-row-label" }, "LEVEL XP BY SOURCE"));
      out.push(bars(sorted(xs.level).map(([k, v]) => [B.XP_SOURCES[k] || k.toUpperCase(), v]), "var(--neon)"));
      const layers = sorted(xs.game_layers);
      if (layers.length) {
        out.push(el("div", { class: "btn-row-label" }, "GAME XP: BASE VS BONUSES · GAMES SINCE SEP 28"));
        out.push(bars(layers.map(([k, v]) => [B.XP_LAYERS[k] || k.toUpperCase(), v]), "var(--cyan)"));
      }
      for (const [key, src] of Object.entries(xs.pass || {})) {
        const sn = seasonsByKey[key] || { name: key, emoji: "💠" };
        out.push(el("div", { class: "btn-row-label" }, `${sn.emoji} ${sn.name.toUpperCase()} PASS XP BY SOURCE`));
        out.push(bars(sorted(src).map(([k, v]) => [B.XP_SOURCES[k] || k.toUpperCase(), v]), "var(--yellow)"));
      }
      for (const [key, pk] of Object.entries(xs.pumpkins || {})) {
        const sn = seasonsByKey[key] || { name: key };
        out.push(el("div", { class: "btn-row-label" }, `🎃 FLAMING PUMPKINS · ${sn.name.toUpperCase()}`));
        out.push(el("div", { class: "tiles" },
          [["SMASHED", B.fmt(pk.smashed)], ["PASS XP FROM PUMPKINS", B.fmt(pk.xp)], ["BIGGEST PUMPKIN", B.fmt(pk.best)],
            ...(pk.missed ? [["MISSED", B.fmt(pk.missed)]] : [])].map(([l, v]) =>
            el("div", { class: "tile", style: { "--c": "#ff8a3d" } }, el("span", { class: "label" }, l), el("span", { class: "value" }, v)))));
      }
    }

    // categories for this period
    const cats = Object.entries((me.categories || {})[period] || {}).sort((a, b) => b[1][0] - a[1][0]);
    out.push(el("h2", { class: "section" }, `CATEGORIES · ${cats.length}`));
    if (cats.length) {
      const catRows = cats.map(([c, [n, pts]]) => {
        const r = B.rankOf(lb, B.categoryMetric(c), period, id);
        return el("tr", {}, el("td", {}, el("a", { href: `leaderboard.html#${encodeURIComponent("cat:" + c)}|${period}` }, c)),
          el("td", {}, B.fmt(n)), el("td", {}, B.fmt(pts)), el("td", { style: { color: r === 1 ? "var(--yellow)" : "" } }, r ? `#${r}` : "—"));
      });
      const catBody = el("tbody");
      const moreCats = B.showMore(catBody, catRows, 10, "CATEGORIES");  // top 10 first: some players have 45+
      out.push(el("div", { class: "table-scroll" }, el("table", { class: "grid" },
        el("thead", {}, el("tr", {}, el("th", {}, "CATEGORY"), el("th", {}, "CORRECT"), el("th", {}, "POINTS"), el("th", {}, "RANK"))),
        catBody)));
      if (moreCats) out.push(moreCats);
    } else out.push(el("p", { class: "page-sub" }, "No correct answers in this period."));

    // head-to-head
    if (u.rivals && u.rivals.length) {
      out.push(el("h2", { class: "section" }, "HEAD TO HEAD"));
      out.push(el("div", { class: "table-scroll" }, el("table", { class: "grid" },
        el("thead", {}, el("tr", {}, el("th", {}, "OPPONENT"), el("th", {}, "DUELS"), el("th", {}, "W–L–T"), el("th", {}, "WIN %"))),
        el("tbody", {}, u.rivals.map(r => el("tr", {},
          el("td", {}, el("div", { class: "who", style: { display: "flex", alignItems: "center", gap: "10px" } }, B.avatar(r.user_id), B.playerLink(r.user_id))),
          el("td", {}, String(r.played)),
          el("td", {}, el("span", { class: r.wins > r.losses ? "res-w" : r.wins < r.losses ? "res-l" : "res-t" }, `${r.wins}–${r.losses}–${r.ties}`)),
          el("td", {}, B.pct(r.wins, r.played))))))));
    }

    // recent matches
    const mine = matches.filter(m => m.kind === "duel" ? (m.challenger_id === id || m.opponent_id === id) : m.winner_id === id || m.started_by === id).slice(0, 10);
    if (mine.length) {
      out.push(el("h2", { class: "section" }, "RECENT MATCHES", el("a", { href: "replays.html" }, "ALL REPLAYS ▸")));
      out.push(el("div", { class: "mlist" }, mine.map(m => {
        const k = B.matchKind(m);
        let res = null;
        if (m.kind === "duel") {  // a 0-0 duel won on the tiebreaker still has a winner and a loser
          res = m.is_tie ? ["TIE", "res-t"] : !m.winner_id ? null : m.winner_id === id ? ["WIN", "res-w"] : ["LOSS", "res-l"];
        } else if (m.winner_id === id) res = ["WIN", "res-w"];
        return el("a", { class: "mrow", href: B.matchHref(m), style: { "--c": k.color } },
          el("span", { class: "kind" }, k.label),
          el("span", { class: "what" }, el("span", { class: "t" }, res ? el("span", { class: res[1] }, `${res[0]} · `) : null, B.matchTitle(m))),
          el("span", { class: "when" }, B.when(m.ended_at)));
      })));
      out.push(el("p", { class: "page-sub" }, "Every duel, plus games this player won or started."));
    }

    // achievements
    const ach = u.achievements || { catalog: [], unlocked: {} };
    const got = ach.catalog.filter(a => ach.unlocked[a.key]).sort((a, b) => (B.ts(ach.unlocked[b.key]) || 0) - (B.ts(ach.unlocked[a.key]) || 0));
    const locked = ach.catalog.filter(a => !ach.unlocked[a.key]);
    const badge = (a, on) => el("div", { class: `badge${on ? " got" : ""}` },
      el("div", { class: "bn" }, a.name),
      el("div", { class: "bd" }, a.description),
      el("div", { class: "bd", style: { color: on ? "var(--text)" : "var(--muted)" } },
        on ? `Unlocked ${B.day(ach.unlocked[a.key])}` : "Locked", a.reward_xp ? ` · +${B.fmt(a.reward_xp)} XP` : ""));
    out.push(el("h2", { class: "section" }, `ACHIEVEMENTS ${got.length} / ${ach.catalog.length}`));
    // The 6 most recent unlocks first (a full list is thousands of pixels on a phone), then SHOW ALL / SHOW LOCKED.
    const grid = el("div", { class: "badges" });
    const moreGot = B.showMore(grid, got.map(a => badge(a, true)), 6, "UNLOCKED");
    out.push(grid);
    if (moreGot) out.push(moreGot);
    if (locked.length) {
      const more = el("button", { class: "btn more", type: "button" }, `SHOW ${locked.length} LOCKED`);
      more.addEventListener("click", () => { if (moreGot && moreGot.isConnected) moreGot.click(); grid.append(...locked.map(a => badge(a, false))); more.remove(); });
      out.push(more);
    }

    // cosmetics
    if (u.cosmetics && u.cosmetics.length) {
      const types = {};
      for (const c of u.cosmetics) {
        const t = (types[c.cosmetic_type] = types[c.cosmetic_type] || { have: 0, all: 0 });
        t.all++; if (c.unlocked) t.have++;
      }
      const LABELS = { footer: "FOOTERS", emoji: "EMOJI PACKS", theme: "RESPONSE THEMES", embedcolor: "EMBED COLORS", mvp: "MVP CARDS" };
      out.push(el("h2", { class: "section" }, "COSMETICS"));
      out.push(el("div", { class: "tiles" }, Object.entries(types).map(([t, n]) =>
        el("div", { class: "tile", style: { "--c": "var(--purple)" } },
          el("span", { class: "label" }, LABELS[t] || t.toUpperCase()), el("span", { class: "value" }, `${n.have} / ${n.all}`)))));
    }
    body.replaceChildren(...out);

    // Jump chips in the sticky bar, one per section, so a long profile doesn't mean scrolling through all of it.
    const SHORT = { "XP & LEVEL": "XP", "WHERE THE XP CAME FROM": "XP SOURCES", "HEAD TO HEAD": "RIVALS", "RECENT MATCHES": "MATCHES",
      "MISSIONS & ACHIEVEMENTS": "MISSIONS" };
    const SHORT_PREFIX = [["TOP ", "FASTEST"]];
    const chips = [...body.querySelectorAll("h2.section")].map((h, i) => {
      const full = (h.firstChild && h.firstChild.textContent || "").trim();
      const text = SHORT[full] || (SHORT_PREFIX.find(([p]) => full.startsWith(p)) || [])[1] || full.replace(/\s*[·\d/].*$/, "").split(" & ")[0];
      h.id = `sec-${i}`;
      return el("a", { class: "chip", href: `#sec-${i}`, onclick: e => { e.preventDefault(); h.scrollIntoView({ behavior: "smooth" }); } }, text);
    });
    periodBar.append(el("nav", { class: "jump", "aria-label": "Jump to section" }, chips));
  }
  draw();
  B.footer();
})();
</script>
</body>
</html>
